/* Renders a self-contained, dependency-free SVG line chart: sensex-style per-segment
   green/red coloring based on day-over-day direction, a soft area fill, gridlines, and
   invisible larger hit-circles per point for the hover tooltip. */
function buildLineChartSvg(labels, values, opts){
  const W = 900, H = 320;
  const padL = 58, padR = 16, padT = 16, padB = 34;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const decimals = opts.decimals!==undefined ? opts.decimals : 2;

  const validVals = values.filter(v => v!==null && v!==undefined && !isNaN(v));
  if(validVals.length === 0){
    return `<div class="empty-state" style="padding:40px;">No values to chart for this metric yet.</div>`;
  }

  let minV = 0, maxV = Math.max(...validVals, 0);
  if(maxV === 0){ maxV = 1; } // avoid a divide-by-zero flat line when every value is 0
  maxV += maxV * 0.08; // headroom above the highest point

  const n = values.length;
  function xAt(i){ return padL + (n > 1 ? i * (plotW/(n-1)) : plotW/2); }
  function yAt(v){ return padT + plotH - ((v - minV) / (maxV - minV)) * plotH; }

  const pts = [];
  values.forEach((v,i)=>{ if(v!==null && v!==undefined && !isNaN(v)) pts.push({ i, v, x:xAt(i), y:yAt(v) }); });

  let segmentsSvg = '';
  for(let k=1; k<pts.length; k++){
    const a = pts[k-1], b = pts[k];
    const color = b.v >= a.v ? '#3dd68c' : '#f0665e';
    segmentsSvg += `<line x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>`;
  }

  let areaPath = '';
  if(pts.length > 0){
    areaPath = `M ${pts[0].x.toFixed(1)} ${(padT+plotH).toFixed(1)} `;
    pts.forEach(p=> areaPath += `L ${p.x.toFixed(1)} ${p.y.toFixed(1)} `);
    areaPath += `L ${pts[pts.length-1].x.toFixed(1)} ${(padT+plotH).toFixed(1)} Z`;
  }

  const gridCount = 4;
  let gridSvg = '';
  for(let g=0; g<=gridCount; g++){
    const v = minV + (maxV - minV) * (g / gridCount);
    const y = yAt(v);
    gridSvg += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#1f2733" stroke-width="1"/>`;
    gridSvg += `<text x="${padL-8}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="10" fill="#5c6675">${opts.prefix||''}${v.toFixed(decimals)}</text>`;
  }

  const maxLabels = 8;
  const labelStep = Math.max(1, Math.ceil(n / maxLabels));
  let xLabelsSvg = '';
  labels.forEach((lbl,i)=>{
    if(i % labelStep === 0 || i === n-1){
      xLabelsSvg += `<text x="${xAt(i).toFixed(1)}" y="${H-14}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#5c6675">${lbl}</text>`;
    }
  });

  let pointsSvg = '';
  pts.forEach(p=>{
    const color = '#3dd68c';
    pointsSvg += `<circle class="report-pt" data-idx="${p.i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="#10141a" stroke="${color}" stroke-width="2"/>`
      + `<circle class="report-hit" data-idx="${p.i}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="11" fill="transparent" style="cursor:pointer;"/>`;
  });

  return `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%; height:100%; display:block;">
      <defs>
        <linearGradient id="reportAreaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3dd68c" stop-opacity="0.30"/>
          <stop offset="100%" stop-color="#3dd68c" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${gridSvg}
      <path d="${areaPath}" fill="url(#reportAreaGrad)" stroke="none"/>
      ${segmentsSvg}
      ${pointsSvg}
      ${xLabelsSvg}
    </svg>
  `;
}

function attachChartTooltips(wrap, labels, values, opts){
  const tooltip = wrap.querySelector('.report-chart-tooltip');
  if(!tooltip) return;
  wrap.querySelectorAll('.report-hit').forEach(hit=>{
    const idx = +hit.dataset.idx;
    const pt = hit.previousElementSibling; // the visible point circle, emitted right before its hit circle
    hit.addEventListener('mouseenter', ()=>{
      const rect = hit.getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();
      const val = values[idx];
      tooltip.style.left = (rect.left - wrapRect.left + rect.width/2) + 'px';
      tooltip.style.top = (rect.top - wrapRect.top) + 'px';
      tooltip.textContent = `${labels[idx]} — ${val===null? 'no data' : (opts.prefix||'')+val+(opts.unit||'')}`;
      tooltip.classList.add('visible');
      if(pt) pt.setAttribute('r', '5');
    });
    hit.addEventListener('mouseleave', ()=>{
      tooltip.classList.remove('visible');
      if(pt) pt.setAttribute('r', '3.5');
    });
  });
}

function fmtDateShort(dstr){
  const [y,m,d] = dstr.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-IN', { day:'2-digit', month:'short' });
}


/* ============ INSIGHTS TAB ============ */
const INSIGHTS_MIN_DAYS = 5;       // minimum logged days before a bus is judged "consistent"
const INSIGHTS_GOOD_PCT = 70;      // % of days in the "good" avg tier to call a bus consistently good
const INSIGHTS_BAD_PCT = 50;       // % of days in the "bad" avg tier to flag a bus as needing attention
const INSIGHTS_DECLINE_PCT = -12;  // % drop from earlier half to recent half to flag a declining trend
const INSIGHTS_TOP_N = 8;

function computeBusInsights(records){
  const byBus = {};
  records.forEach(r=>{
    const key = r.group + '|' + r.body;
    if(!byBus[key]) byBus[key] = { group:r.group, body:r.body, all:[] };
    byBus[key].all.push(r);
  });

  const results = [];
  Object.values(byBus).forEach(b=>{
    const valid = b.all.filter(r=> r.avg!==null).sort((a,c)=> a.date.localeCompare(c.date));
    if(valid.length < INSIGHTS_MIN_DAYS) return;

    let totalKm=0, totalCng=0, goodCount=0, badCount=0;
    const t = getAvgThresholds(b.group);
    valid.forEach(r=>{
      totalKm += r.km; totalCng += (r.cngTotal||0);
      if(r.avg >= t.good) goodCount++;
      else if(r.avg < t.bad) badCount++;
    });
    const overallAvg = totalCng>0 ? totalKm/totalCng : null;
    const goodPct = (goodCount/valid.length)*100;
    const badPct = (badCount/valid.length)*100;

    // trend: compare weighted avg of the earlier half vs the more recent half
    const mid = Math.ceil(valid.length/2);
    const earlier = valid.slice(0, mid), recent = valid.slice(mid);
    function weightedAvg(list){
      let km=0, cng=0;
      list.forEach(r=>{ km+=r.km; cng+=(r.cngTotal||0); });
      return cng>0 ? km/cng : null;
    }
    const earlierAvg = weightedAvg(earlier);
    const recentAvg = recent.length>0 ? weightedAvg(recent) : null;
    const trendPct = (earlierAvg && recentAvg!==null && earlierAvg>0) ? ((recentAvg-earlierAvg)/earlierAvg)*100 : null;

    results.push({
      group: b.group, body: b.body, days: valid.length,
      overallAvg, goodPct, badPct, goodCount, badCount,
      earlierAvg, recentAvg, trendPct
    });
  });
  return results;
}

function renderInsightsTab(container){
  if(!state.insightsDepot) state.insightsDepot = 'all';
  container.innerHTML = `<div class="empty-state">Analyzing fleet performance…</div>`;
  loadAllRecords().then(records=>{
    if(records.length === 0){
      container.innerHTML = `<div class="empty-state"><div class="ei">💡</div>No data logged yet. Insights need entries to analyze.</div>`;
      return;
    }
    const allInsights = computeBusInsights(records);
    if(allInsights.length === 0){
      container.innerHTML = `<div class="empty-state"><div class="ei">💡</div>Not enough history yet — insights need at least ${INSIGHTS_MIN_DAYS} logged days per bus. Keep entering data and check back.</div>`;
      return;
    }

    renderPills();
    renderBody();

    function renderPills(){
      const wrap = document.createElement('div');
      wrap.className = 'depot-pill-row';
      wrap.id = 'insights-pill-row';
      wrap.innerHTML = `<button class="depot-pill ${state.insightsDepot==='all'?'active':''}" data-code="all">All Depots</button>
        ${GROUPS.map(g=>{
          const count = allInsights.filter(b=>b.group===g).length;
          return `<button class="depot-pill ${state.insightsDepot===g?'active':''}" data-code="${g}">${g}${count>0? ` (${count})`:''}</button>`;
        }).join('')}`;
      container.innerHTML = '';
      container.appendChild(wrap);
      const bodyDiv = document.createElement('div');
      bodyDiv.id = 'insights-body';
      container.appendChild(bodyDiv);
      wrap.querySelectorAll('.depot-pill').forEach(btn=>{
        btn.onclick = ()=>{
          state.insightsDepot = btn.dataset.code;
          wrap.querySelectorAll('.depot-pill').forEach(b=>b.classList.toggle('active', b===btn));
          renderBody();
        };
      });
    }

    function renderBody(){
      const bodyEl = document.getElementById('insights-body');
      const insights = state.insightsDepot==='all' ? allInsights : allInsights.filter(b=>b.group===state.insightsDepot);

      if(insights.length === 0){
        bodyEl.innerHTML = `<div class="empty-state"><div class="ei">💡</div>Not enough history yet for ${state.insightsDepot} — insights need at least ${INSIGHTS_MIN_DAYS} logged days per bus.</div>`;
        return;
      }

      const consistentGood = insights.filter(b=> b.goodPct>=INSIGHTS_GOOD_PCT).sort((a,c)=> c.goodPct-a.goodPct || c.overallAvg-a.overallAvg).slice(0, INSIGHTS_TOP_N);
      const consistentBad = insights.filter(b=> b.badPct>=INSIGHTS_BAD_PCT).sort((a,c)=> c.badPct-a.badPct || a.overallAvg-c.overallAvg).slice(0, INSIGHTS_TOP_N);
      const declining = insights.filter(b=> b.trendPct!==null && b.trendPct<=INSIGHTS_DECLINE_PCT).sort((a,c)=> a.trendPct-c.trendPct).slice(0, INSIGHTS_TOP_N);

      function rowsHtml(list, kind){
        if(list.length===0) return `<div class="empty-state" style="padding:24px;">None right now.</div>`;
        return `<table class="rank-table"><thead><tr>
            <th>#</th><th>Bus</th><th>Avg</th>
            ${kind==='good'? '<th>Good Days</th>' : ''}
            ${kind==='bad'? '<th>Bad Days</th>' : ''}
            ${kind==='decline'? '<th>Earlier</th><th>Recent</th><th>Change</th>' : ''}
            <th>Days Logged</th>
          </tr></thead><tbody>
          ${list.map((b,i)=>{
            const busLabel = state.insightsDepot==='all' ? `${b.group} ${extractBodyNumber(b.body, b.group)}` : extractBodyNumber(b.body, b.group);
            let extraCols = '';
            if(kind==='good') extraCols = `<td style="color:var(--green);">${b.goodPct.toFixed(0)}% (${b.goodCount}/${b.days})</td>`;
            if(kind==='bad') extraCols = `<td style="color:var(--red);">${b.badPct.toFixed(0)}% (${b.badCount}/${b.days})</td>`;
            if(kind==='decline') extraCols = `<td>${b.earlierAvg.toFixed(2)}</td><td>${b.recentAvg.toFixed(2)}</td><td style="color:var(--red);">${b.trendPct.toFixed(0)}%</td>`;
            return `<tr>
              <td class="rank-num">${i+1}</td>
              <td class="rk-body">${busLabel}</td>
              <td><span class="avg-pill ${avgClass(b.overallAvg, b.group)}">${b.overallAvg!==null? b.overallAvg.toFixed(2):'—'}</span></td>
              ${extraCols}
              <td>${b.days}</td>
            </tr>`;
          }).join('')}
        </tbody></table>`;
      }

      const titleSuffix = state.insightsDepot==='all' ? 'fleet-wide' : state.insightsDepot;

function renderHistoryTab(container){

    container.innerHTML = `<h2 class="section-title">Select depot to view history</h2><div class="group-grid" id="hist-group-grid"></div>`;
    const grid = document.getElementById('hist-group-grid');
    GROUPS.forEach(g=>{
      const count = BUS_DATA[g] ? BUS_DATA[g].length : 0;
      const card = document.createElement('button');
      card.className = 'group-card';
      card.innerHTML = `<div class="g-code">${g}</div><div class="g-count">${count} buses</div>`;
      card.onclick = ()=>{ state.historyGroup = g; renderHistoryTab(container); };
      grid.appendChild(card);
    });
    return;
  }

  if(state.historyDate){
    renderHistoryEditor(container);
    return;
  }

  container.innerHTML = `<div id="hist-list-wrap"></div>`;
  const wrap = document.getElementById('hist-list-wrap');
  wrap.innerHTML = `<button class="back-link" id="back-to-groups">&larr; All depots</button>
    <h2 class="section-title">${state.historyGroup} &middot; Past entries</h2>
    <div id="hist-dates"></div>`;
  document.getElementById('back-to-groups').onclick = ()=>{ state.historyGroup=null; renderHistoryTab(container); };

  loadGroupData(state.historyGroup).then(groupData=>{
    const dates = Object.keys(groupData).sort().reverse();
    const el = document.getElementById('hist-dates');
    if(dates.length === 0){
      el.innerHTML = `<div class="empty-state"><div class="ei">🗂️</div>No entries recorded yet for ${state.historyGroup}.</div>`;
      return;
    }
    el.innerHTML = `<div class="hist-date-list">${dates.map(d=>{
      const rows = groupData[d];
      let totalKm=0, totalCng=0, filled=0;
      rows.forEach(r=>{
        const o=parseFloat(r.opening), c=parseFloat(r.closing), g=parseFloat(r.cng);
        if(!isNaN(o) && !isNaN(c) && c>=o){ totalKm += (c-o); }
        if(!isNaN(g) && g>0){ totalCng += g; filled++; }
      });
      const avg = totalCng>0 ? (totalKm/totalCng).toFixed(2) : '—';
      return `<div class="hist-date-row" data-date="${d}">
        <div class="hist-date-main"><span class="d">${fmtDateLong(d)}</span><span class="cnt">${filled}/${rows.length} buses logged</span></div>

      </div>`;
    }).join('')}</div>`;
    el.querySelectorAll('.hist-date-row').forEach(row=>{
      row.onclick = ()=>{ state.historyDate = row.dataset.date; renderHistoryTab(document.getElementById('tab-content')); };
    });
  });
}

      tr.querySelector('.closing-in').oninput = (e)=>{ workingRows[idx].closing = e.target.value; updateRow(tr, idx); };

    const { km, avg, invalid, costPerKm } = calcRow(r);
    tr.querySelector('.km-run').textContent = km!==null? km.toFixed(1) : '—';

    renderFoot();

    if(st){ st.textContent = 'Unsaved changes'; st.className='save-status'; }

      <td>${fleetCostPerKm!==null? '₹'+fleetCostPerKm.toFixed(2):'—'}</td>

  renderRows();

  document.getElementById('hist-save-btn').onclick = async ()=>{

      station: r.station || null
    }));
    await saveGroupData(group, gd);
    st.textContent = '✓ Updated'; st.className='save-status saved';
  };
}

/* ============ DASHBOARD DATA HELPERS ============ */
async function loadAllRecords(){
  let all = [];
  for(const g of GROUPS){
    const gd = await loadGroupData(g);
    const extraData = await loadExtraData(g);
    const matchedExtraKeys = new Set(); // date|body pairs already folded into a main record

    Object.keys(gd).forEach(date=>{
      const month = date.slice(0,7);
      gd[date].forEach(r=>{
        const hasAny = (r.opening!=='' && r.opening!==null && r.opening!==undefined) ||
                       (r.closing!=='' && r.closing!==null && r.closing!==undefined) ||
                       (r.cng!=='' && r.cng!==null && r.cng!==undefined);
        const extraCng = getExtraForBusDate(extraData, date, r.body);
        if(!hasAny && extraCng<=0) return;
        matchedExtraKeys.add(date+'|'+r.body);
        const { km, avg, cngTotal } = calcRow({ ...r, extraCng });
        const mainRate = parseFloat(r.rate) || 0;
        const mainCost = (parseFloat(r.cng)||0) * mainRate;
        const extraCost = getExtraCostForBusDate(extraData, date, r.body);
        all.push({ group:g, body:r.body, vehicle:r.vehicle, date, month, km, avg, cngTotal, cost: mainCost+extraCost, station: r.station||null, hasExtra: extraCng>0 });
      });
    });

    // extra fills logged for a bus/date with no corresponding main entry — still count toward CNG totals
    Object.keys(extraData).forEach(date=>{
      const month = date.slice(0,7);
      const byBody = {};
      extraData[date].forEach(e=>{
        const key = date+'|'+e.body;
        if(matchedExtraKeys.has(key)) return;
        if(!byBody[e.body]) byBody[e.body] = { kg:0, cost:0, station: e.station||null };
        byBody[e.body].kg += (parseFloat(e.cng)||0);
        byBody[e.body].cost += (parseFloat(e.cng)||0) * (parseFloat(e.rate)||0);
      });
      Object.keys(byBody).forEach(body=>{
        const busInfo = (BUS_DATA[g]||[]).find(b=>b.body===body);
        all.push({ group:g, body, vehicle: busInfo? busInfo.vehicle:'', date, month, km:null, avg:null, cngTotal: byBody[body].kg, cost: byBody[body].cost, station: byBody[body].station, hasExtra:true, extraOnly:true });
      });
    });
  }
  return all;
}
function aggregate(list){
  let totalKm=0, totalCng=0, totalCost=0;
  list.forEach(r=>{
    if(r.km!==null) totalKm+=r.km;
    totalCng += (r.cngTotal||0);
    totalCost += (r.cost||0);
  });
  const avg = totalCng>0 ? totalKm/totalCng : null;
  const costPerKm = (totalCost>0 && totalKm>0) ? totalCost/totalKm : null;
  return { totalKm, totalCng, totalCost, costPerKm, avg, count:list.length };
}
function aggregateByBus(list){
  const map = {};
  list.forEach(r=>{
    const key = r.group+'|'+r.body;
    if(!map[key]) map[key] = { group:r.group, body:r.body, totalKm:0, totalCng:0, totalCost:0, records:0 };
    if(r.km!==null) map[key].totalKm += r.km;
    map[key].totalCng += (r.cngTotal||0);
    map[key].totalCost += (r.cost||0);
    map[key].records++;
  });
  Object.values(map).forEach(b=>{ b.avg = b.totalCng>0 ? b.totalKm/b.totalCng : null; });
  return map;
}
function aggregateByStation(list){
  const map = {};
  list.forEach(r=>{
    if(!r.station) return;
    if(!map[r.station]) map[r.station] = { station:r.station, totalKg:0, totalCost:0 };
    map[r.station].totalKg += (r.cngTotal||0);
    map[r.station].totalCost += (r.cost||0);
  });
  return map;
}
function monthLabel(m){
  const [y,mo] = m.split('-').map(Number);
  return new Date(y, mo-1, 1).toLocaleDateString('en-IN', { month:'short', year:'2-digit' });
}
function barColorClass(avg, group){
  if(avg===null) return 'c-bad';
  const t = getAvgThresholds(group);
  if(avg>=t.good) return 'c-good';
  if(avg>=t.bad) return 'c-mid';
  return 'c-bad';
}

        document.getElementById('depot-metric-toggle').querySelectorAll('button').forEach(x=>x.classList.toggle('active', x===b));
      };
    });

    const stationChart = document.getElementById('depot-station-chart');
    if(stationRows.length === 0){
      stationChart.innerHTML = `<div class="empty-state" style="padding:24px;">No station ticked for ${depot} entries yet.</div>`;
    } else {
      stationChart.innerHTML = stationRows.map(s=>{
        const st = STATIONS.find(x=>x.code===s.station);
        const widthPct = Math.max(4, (s.totalKg/maxStationKg)*100);
        return `<div class="bar-row">
          <div class="bar-label">${st? st.label : s.station}</div>
          <div class="bar-track"><div class="bar-fill c-good" style="width:${widthPct}%"><span>${s.totalKg.toFixed(0)}kg</span></div></div>
          <div class="bar-sub">${s.totalCost>0? '₹'+s.totalCost.toFixed(0):''}</div>
        </div>`;
      }).join('');
    }

    document.getElementById('depot-scope-select').onchange = (e)=>{
      state.dashboardScope = e.target.value;
      renderRankTables(depotRecords, months, 'depot-top-table-wrap', 'depot-bottom-table-wrap', 'depot-scope-select');
    };
  }

  /* ===================== SHARED: monthly chart ===================== */
  function renderMonthChart(months, byMonth, chartId, toggleId, depotGroup){
    const mc = document.getElementById(chartId);
    if(!mc) return;
    let vals = months.map(m=>{
      const d = byMonth[m];
      if(state.monthlyMetric==='avg') return d.avg||0;
      if(state.monthlyMetric==='km') return d.totalKm;
      if(state.monthlyMetric==='cost') return d.totalCost;
      return d.totalCng;
    });
    const maxVal = Math.max(...vals, 0.01);
    mc.innerHTML = months.map((m,i)=>{
      const v = vals[i];
      const hPct = Math.max(4, (v/maxVal)*100);
      const d = byMonth[m];
      const displayVal = state.monthlyMetric==='avg' ? (d.avg!==null? d.avg.toFixed(2):'—')
        : state.monthlyMetric==='cost' ? '₹'+v.toFixed(0)
        : v.toFixed(0);
      const colorCls = state.monthlyMetric==='avg' ? barColorClass(d.avg, depotGroup) : 'c-good';
      const barColor = colorCls==='c-good'?'var(--green)':colorCls==='c-mid'?'var(--amber)':'var(--red)';
      return `<div class="month-col">
        <div class="m-val">${displayVal}</div>
        <div class="m-bar" style="height:${hPct}%; background:${barColor}"></div>
        <div class="m-lbl">${monthLabel(m)}</div>
      </div>`;
    }).join('');
  }

  /* ===================== SHARED: ranking tables ===================== */
  function renderRankTables(scopeAllRecords, months, topId, bottomId, selectId){
    topId = topId || 'top-table-wrap';
    bottomId = bottomId || 'bottom-table-wrap';
    const scopeRecords = state.dashboardScope==='all' ? scopeAllRecords : scopeAllRecords.filter(r=>r.month===state.dashboardScope);
    const busAgg = aggregateByBus(scopeRecords);
    const ranked = Object.values(busAgg).filter(b=>b.avg!==null).sort((a,b)=>b.avg-a.avg);
    const top5 = ranked.slice(0,5);
    const bottom5 = ranked.slice(-5).reverse().filter(b=>!top5.includes(b));

    function tableHtml(list, emptyMsg){
      if(list.length===0) return `<div class="empty-state" style="padding:24px;">${emptyMsg}</div>`;
      return `<table class="rank-table"><thead><tr><th>#</th><th>Bus</th><th>Avg</th></tr></thead><tbody>
        ${list.map((b,i)=>`<tr>
          <td class="rank-num">${i+1}</td>
          <td><div class="rk-body">${b.body}</div><div class="rk-group">${b.group}</div></td>
          <td><span class="avg-pill ${avgClass(b.avg, b.group)}">${b.avg.toFixed(2)}</span></td>
        </tr>`).join('')}
      </tbody></table>`;
    }
    const topEl = document.getElementById(topId);
    const bottomEl = document.getElementById(bottomId);
    if(topEl) topEl.innerHTML = tableHtml(top5, 'Not enough data yet.');
    if(bottomEl) bottomEl.innerHTML = tableHtml(bottom5, 'Not enough data yet.');
  }
}

async function runGasDetailsImportIfNeeded(){
  try{
    await window.storage.get('import-flag-gas-2026-08-28', false);
    return false; // already imported previously
  }catch(e){ /* not found -> proceed with import */ }

  for(const g of GROUPS){
    const groupData = await loadGroupData(g);
    const existing = groupData[GAS_IMPORT_DATE] || [];
    const importList = GAS_IMPORT_DATA[g] || [];
    const buses = BUS_DATA[g] || [];
    const merged = buses.map(b=>{
      const imp = importList.find(x=>x.body===b.body);
      const exist = existing.find(x=>x.body===b.body);
      if(imp){
        return { body:b.body, vehicle:b.vehicle, opening:imp.opening, closing:imp.closing, cng: exist? (exist.cng ?? '') : '' };
      }
      return { body:b.body, vehicle:b.vehicle, opening: exist? (exist.opening ?? ''):'', closing: exist? (exist.closing ?? ''):'', cng: exist? (exist.cng ?? ''):'' };
    });
    groupData[GAS_IMPORT_DATE] = merged;
    await saveGroupData(g, groupData);
  }
  await window.storage.set('import-flag-gas-2026-08-28', 'done', false);
  return true;
}

async function runGasFullImportIfNeeded(){
  try{
    await window.storage.get('import-flag-gas-full-2026-08-28', false);
    return false; // already applied previously
  }catch(e){ /* not found -> proceed */ }

  for(const g of GROUPS){
    const groupData = await loadGroupData(g);
    const existing = groupData[GAS_IMPORT_DATE] || [];
    const importList = GAS_FULL_IMPORT_DATA[g] || [];
    const buses = BUS_DATA[g] || [];
    const merged = buses.map(b=>{
      const imp = importList.find(x=>x.body===b.body);
      const exist = existing.find(x=>x.body===b.body);
      if(imp){
        return { body:b.body, vehicle:b.vehicle, opening:imp.opening, closing:imp.closing, cng:imp.cng };
      }
      return { body:b.body, vehicle:b.vehicle, opening: exist? (exist.opening ?? ''):'', closing: exist? (exist.closing ?? ''):'', cng: exist? (exist.cng ?? ''):'' };
    });
    groupData[GAS_IMPORT_DATE] = merged;
    await saveGroupData(g, groupData);
  }
  await window.storage.set('import-flag-gas-full-2026-08-28', 'done', false);
  return true;
}

/* Confirmed CNG rate for 28 Aug 2026: ₹94.02/Kg — applied to every bus for that date (only fills rows without a rate already set) */
const GAS_IMPORT_RATE = 94.02;
async function runGasRateImportIfNeeded(){
  try{
    await window.storage.get('import-flag-gas-rate-2026-08-28', false);
    return false; // already applied previously
  }catch(e){ /* not found -> proceed */ }

  for(const g of GROUPS){
    const groupData = await loadGroupData(g);
    const existing = groupData[GAS_IMPORT_DATE] || [];
    if(existing.length === 0) continue;
    existing.forEach(r=>{
      if(r.rate === '' || r.rate === null || r.rate === undefined){
        r.rate = GAS_IMPORT_RATE;
      }
    });
    groupData[GAS_IMPORT_DATE] = existing;
    await saveGroupData(g, groupData);
  }
  await window.storage.set('import-flag-gas-rate-2026-08-28', 'done', false);
  return true;
}

/* ============ ONLINE SERVER MODE ============
   When this page is opened from the CNG server (not double-clicked from disk),
   all data, logins and the user log live on the server and are shared by everyone. */
window.__cngServer = false;
async function detectServer(){
  if(location.protocol === 'file:') return false;
  try{ const r = await fetch('api/ping', {cache:'no-store'}); if(!r.ok) return false; const j = await r.json(); return !!(j && j.app === 'cng-board'); }
  catch(e){ return false; }
}
function showNetErr(msg){
  let el = document.getElementById('net-err');
  if(!el){ el = document.createElement('div'); el.id = 'net-err'; el.className = 'net-err'; document.body.appendChild(el); }
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(showNetErr._t); showNetErr._t = setTimeout(()=>{ el.style.display='none'; }, 8000);
}
async function api(pathPart, opts){
  opts = opts || {};
  const s = authCurrent();
  const headers = Object.assign({}, opts.headers || {});
  if(s && s.token) headers['Authorization'] = 'Bearer ' + s.token;
  let r;
  try{ r = await fetch('api/' + pathPart, Object.assign({}, opts, { headers, cache:'no-store' })); }
  catch(e){ showNetErr('⚠️ Server unreachable — this change was NOT saved. Check internet and try again.'); throw e; }
  if(r.status === 401 && pathPart !== 'login'){
    authSession.removeItem('cngauth:session');
    renderLogin('Session expired — please sign in again.');
    throw new Error('unauthorized');
  }
  return r;
}
function makeServerStorage(){
  const q = (key, shared)=> 'kv/' + encodeURIComponent(key) + '?shared=' + (shared ? 1 : 0);
  return {
    get: async (key, shared)=>{
      const r = await api(q(key, shared));
      if(r.status === 404) throw new Error('Key not found: ' + key);
      if(!r.ok) throw new Error('Server error ' + r.status);
      return { key, value: await r.text(), shared: !!shared };
    },
    set: async (key, value, shared)=>{
      const r = await api(q(key, shared), { method:'PUT', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: value });
      if(!r.ok){ showNetErr('⚠️ Server rejected the save (' + r.status + ') — NOT saved.'); throw new Error('Save failed ' + r.status); }
      return { key, value, shared: !!shared };
    },
    delete: async (key, shared)=>{ await api(q(key, shared), { method:'DELETE' }); return { key, deleted:true, shared:!!shared }; },
    list: async (prefix, shared)=>{
      const r = await api('kv?prefix=' + encodeURIComponent(prefix || '') + '&shared=' + (shared ? 1 : 0));
      const j = await r.json();
      return { keys: j.keys || [], prefix, shared: !!shared };
    }
  };
}

  catch(e){ const m={}; return { getItem:k=>(k in m?m[k]:null), setItem:(k,v)=>{m[k]=String(v);}, removeItem:k=>{delete m[k];} }; }
})();
const authSession = (function(){
  try{ sessionStorage.setItem('cngauth:__t','1'); sessionStorage.removeItem('cngauth:__t'); return sessionStorage; }
  catch(e){ const m={}; return { getItem:k=>(k in m?m[k]:null), setItem:(k,v)=>{m[k]=String(v);}, removeItem:k=>{delete m[k];} }; }
})();
function authRead(k, fb){ try{ const v = authStore.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return fb; } }
function authWrite(k, v){ try{ authStore.setItem(k, JSON.stringify(v)); }catch(e){} }

/* compact synchronous SHA-256 (works on file:// in every browser, no crypto.subtle needed) */
function sha256(ascii){
  function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
  const K=[], H=[]; let isC={}, n=2;
  while(H.length<64){ if(!isC[n]){ for(let i=n*n;i<313;i+=n) isC[i]=1; H.push((Math.pow(n,.5)*4294967296)|0); K.push((Math.pow(n,1/3)*4294967296)|0); } n++; }
  let hash = H.slice(0,8);
  const bytes = unescape(encodeURIComponent(ascii));
  const words = []; const bl = bytes.length*8;
  let s = bytes + '\x80'; while(s.length%64-56) s += '\x00';
  for(let i=0;i<s.length;i++) words[i>>2] |= s.charCodeAt(i) << ((3-i)%4)*8;
  words[words.length] = (bl/4294967296)|0; words[words.length] = bl|0;
  for(let j=0;j<words.length;){
    const w = words.slice(j, j+=16); const old = hash.slice(0);
    for(let i=0;i<64;i++){
      const w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      const t1 = hash[7] + (rr(e,6)^rr(e,11)^rr(e,25)) + ((e&hash[5])^((~e)&hash[6])) + K[i]
        + (w[i] = (i<16) ? w[i] : (w[i-16] + (rr(w15,7)^rr(w15,18)^(w15>>>3)) + w[i-7] + (rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2 = (rr(a,2)^rr(a,13)^rr(a,22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(t1+t2)|0].concat(hash); hash[4] = (hash[4]+t1)|0; hash.length = 8;
    }
    for(let i=0;i<8;i++) hash[i] = (hash[i]+old[i])|0;
  }
  let out=''; for(let i=0;i<8;i++) for(let j=3;j+1;j--){ const b=(hash[i]>>(j*8))&255; out += (b<16?'0':'') + b.toString(16); }
  return out;
}
function authHash(userKey, pw){ return sha256(userKey + ':' + pw + AUTH_SALT); }
function authUsers(){
  const u = authRead('cngauth:users', null);
  if(!u || !u.vc1705 || !u.admin){ authWrite('cngauth:users', AUTH_DEFAULT_USERS); return JSON.parse(JSON.stringify(AUTH_DEFAULT_USERS)); }
  return u;
}
function authCurrent(){ try{ const s = authSession.getItem('cngauth:session'); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function isSuperAdmin(){ const s = authCurrent(); return !!(s && s.role === 'superadmin'); }
function escHtml(v){ return String(v==null?'':v).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* type: login | fail | logout | pw | act */
function logActivity(type, detail, userOverride){
  if(window.__cngServer){
    // server records login / failed / logout / password events itself; client only reports data actions
    if(type === 'act' && authCurrent()) api('log', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ detail }) }).catch(()=>{});
    return;
  }
  const s = authCurrent();
  const user = userOverride || (s ? s.display : '—');
  const logs = authRead('cngauth:logs', []);
  const now = Date.now();
  // coalesce repeat saves of the same thing by the same user within 2 minutes into one row
  let last = null;
  if(type === 'act'){
    for(let i = logs.length-1; i >= Math.max(0, logs.length-15); i--){
      const l = logs[i];
      if(now - l.t > 120000) break;
      if(l.type === 'act' && l.user === user && l.detail === detail){ last = l; break; }
    }
  }
  if(last){
    last.t = now; last.count = (last.count||1) + 1;
  } else {
    logs.push({ t: now, user, type, detail, count: 1 });
  }
  if(logs.length > AUTH_MAX_LOGS) logs.splice(0, logs.length - AUTH_MAX_LOGS);
  authWrite('cngauth:logs', logs);
}
function actContext(){
  if(state.tab === 'entry') return `Entry ${state.date}`;
  if(state.tab === 'extra') return `Extra CNG ${state.extraGridDate || ''}`.trim();
  if(state.tab === 'history') return `History ${state.historyDate || ''}`.trim();
  return state.tab.charAt(0).toUpperCase() + state.tab.slice(1);
}

async function attemptLogin(username, pw){
  if(window.__cngServer){
    let r;
    try{ r = await api('login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password: pw }) }); }
    catch(e){ return { ok:false, msg:'Cannot reach the server.' }; }
    const j = await r.json().catch(()=>({}));
    if(!r.ok) return { ok:false, msg: j.error || 'Login failed.' };
    authSession.setItem('cngauth:session', JSON.stringify({ key:j.key, display:j.display, role:j.role, token:j.token, at:Date.now() }));
    return { ok:true };
  }
  const lock = authRead('cngauth:fail', { count:0, until:0 });
  if(lock.until && Date.now() < lock.until){
    return { ok:false, msg:`Too many wrong attempts. Try again in ${Math.ceil((lock.until-Date.now())/1000)}s.` };
  }
  const key = String(username||'').trim().toLowerCase();
  const users = authUsers();
  const u = users[key];
  if(!u || authHash(key, pw) !== u.hash){
    lock.count = (lock.count||0) + 1;
    if(lock.count >= AUTH_MAX_FAILS){ lock.until = Date.now() + AUTH_LOCK_MS; lock.count = 0; }
    authWrite('cngauth:fail', lock);
    logActivity('fail', `Wrong credentials for "${String(username||'').trim().slice(0,40)}"`, String(username||'').trim().slice(0,40) || '(blank)');
    return { ok:false, msg:'Invalid username or password.' };
  }
  authWrite('cngauth:fail', { count:0, until:0 });
  authSession.setItem('cngauth:session', JSON.stringify({ key, display:u.display, role:u.role, at:Date.now() }));
  logActivity('login', u.role === 'superadmin' ? 'Signed in (Super Admin)' : 'Signed in');
  return { ok:true };
}
function doLogout(){
  if(window.__cngServer) api('logout', { method:'POST' }).catch(()=>{});
  else logActivity('logout', 'Signed out');
  authSession.removeItem('cngauth:session');
  state.tab = 'entry';
  renderLogin();
}
async function changePassword(targetKey, newPw){
  if(window.__cngServer){
    try{
      const r = await api('password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ target: targetKey, password: newPw }) });
      const j = await r.json().catch(()=>({}));
      return r.ok ? { ok:true, msg:j.msg } : { ok:false, msg: j.error || 'Failed.' };
    }catch(e){ return { ok:false, msg:'Cannot reach the server.' }; }
  }
  if(!isSuperAdmin()) return { ok:false, msg:'Only Super Admin can change passwords.' };
  const users = authUsers();
  if(!users[targetKey]) return { ok:false, msg:'Unknown user.' };
  users[targetKey].hash = authHash(targetKey, newPw);
  authWrite('cngauth:users', users);
  logActivity('pw', `Changed password of ${users[targetKey].display}`);
  return { ok:true, msg:`✓ Password updated for ${users[targetKey].display}.` };
}

function renderLogin(msg){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="login-wrap"><div class="login-card">
      <div class="board-title"><span class="live-dot"></span>CNG MILEAGE <span>BOARD</span></div>
      <div class="board-sub">Sign in to continue</div>
      <label for="login-user">Username</label>
      <input class="auth-input" id="login-user" autocomplete="username" autocapitalize="off" spellcheck="false">
      <label for="login-pass">Password</label>
      <input class="auth-input" id="login-pass" type="password" autocomplete="current-password">
      <button class="btn btn-primary" id="login-btn">Sign in</button>
      <div class="auth-err" id="login-err">${msg ? escHtml(msg) : ''}</div>
    </div></div>`;
  const u = document.getElementById('login-user'), p = document.getElementById('login-pass');
  const go = async ()=>{
    const res = await attemptLogin(u.value, p.value);
    if(!res.ok){ document.getElementById('login-err').textContent = res.msg; p.value=''; p.focus(); return; }
    await startApp();
  };
  document.getElementById('login-btn').onclick = go;
  u.onkeydown = e=>{ if(e.key==='Enter') p.focus(); };
  p.onkeydown = e=>{ if(e.key==='Enter') go(); };
  u.focus();
}

async function renderAdminTab(container){
  if(!isSuperAdmin()){ container.innerHTML = ''; return; }
  const users = authUsers();
  let logs;
  if(window.__cngServer){
    container.innerHTML = '<div class="board-sub">Loading log…</div>';
    try{ const r = await api('logs'); logs = r.ok ? await r.json() : []; }catch(e){ return; }
    if(!document.body.contains(container)) return;
  } else logs = authRead('cngauth:logs', []);
  const f = state.logFilter || (state.logFilter = { user:'all', type:'all' });
  const lastLogin = key => {
    const d = users[key].display;
    const l = [...logs].reverse().find(x => x.type==='login' && x.user===d);
    return l ? new Date(l.t).toLocaleString('en-IN') : 'never';
  };
  const userOpts = ['all', ...new Set(logs.map(l=>l.user))];
  const shown = logs.filter(l => (f.user==='all'||l.user===f.user) && (f.type==='all'||l.type===f.type)).reverse();
  const evLabel = { login:['ev-login','LOGIN'], fail:['ev-fail','FAILED'], logout:['ev-out','LOGOUT'], pw:['ev-pw','PASSWORD'], act:['ev-act','ACTION'] };
  container.innerHTML = `
    <div class="admin-grid">
      <div class="admin-card">
        <h3>Change password</h3>
        <label class="board-sub" style="display:block;margin-bottom:6px">Account</label>
        <select id="pw-target">
          <option value="admin">Admin (user)</option>
          <option value="vc1705">vc1705 (super admin — you)</option>
        </select>
        <label class="board-sub" style="display:block;margin:12px 0 6px">New password</label>
        <input class="auth-input" id="pw-new" type="password" autocomplete="new-password">
        <label class="board-sub" style="display:block;margin:12px 0 6px">Confirm new password</label>
        <input class="auth-input" id="pw-confirm" type="password" autocomplete="new-password">
        <button class="btn btn-primary" id="pw-save" style="margin-top:14px">Update password</button>
        <div class="auth-err" id="pw-msg"></div>
      </div>
      <div class="admin-card">
        <h3>Accounts</h3>
        <div class="user-last">
          <div><b>Admin</b> &middot; user &middot; last login: ${escHtml(lastLogin('admin'))}</div>
          <div><b>vc1705</b> &middot; super admin &middot; last login: ${escHtml(lastLogin('vc1705'))}</div>
          <div style="margin-top:10px">Failed attempts logged: ${logs.filter(l=>l.type==='fail').length}</div>
          <div>Log entries: ${logs.length} (keeps latest ${AUTH_MAX_LOGS})</div>
        </div>
        <div class="board-sub" style="margin-top:12px; text-transform:none; letter-spacing:0; line-height:1.5">
          ${window.__cngServer ? 'Logs and passwords are stored on the <b>server</b> — shared across every PC.' : 'Logs show activity on <b>this browser on this PC only</b>. Export them before clearing browser data.'}
        </div>
      </div>
    </div>
    <div class="admin-card">
      <h3>User log</h3>
      <div class="admin-filters">
        <select id="log-user">${userOpts.map(u=>`<option value="${escHtml(u)}" ${f.user===u?'selected':''}>${u==='all'?'All users':escHtml(u)}</option>`).join('')}</select>
        <select id="log-type">
          ${[['all','All events'],['login','Logins'],['fail','Failed logins'],['logout','Logouts'],['act','Data actions'],['pw','Password changes']]
            .map(([v,l])=>`<option value="${v}" ${f.type===v?'selected':''}>${l}</option>`).join('')}
        </select>
        <span style="flex:1"></span>
        <button class="btn" id="log-export" style="padding:6px 12px;font-size:11px">⬇ Export CSV</button>
        <button class="btn" id="log-clear" style="padding:6px 12px;font-size:11px">Clear log</button>
      </div>
      <div class="log-scroll"><table class="log-table">
        <thead><tr><th>Time</th><th>User</th><th>Event</th><th>Detail</th></tr></thead>
        <tbody>${shown.length ? shown.map(l=>{ const e = evLabel[l.type]||['','']; return `<tr>
          <td>${escHtml(new Date(l.t).toLocaleString('en-IN'))}</td>
          <td>${escHtml(l.user)}</td>
          <td class="${e[0]}">${e[1]}</td>
          <td>${escHtml(l.detail)}${l.count>1?` <span style="color:var(--muted-2)">×${l.count}</span>`:''}</td></tr>`; }).join('')
          : `<tr><td colspan="4" style="color:var(--muted-2)">No entries.</td></tr>`}</tbody>
      </table></div>
    </div>`;

  document.getElementById('pw-save').onclick = async ()=>{
    const msg = document.getElementById('pw-msg');
    const a = document.getElementById('pw-new').value, b = document.getElementById('pw-confirm').value;
    msg.classList.remove('auth-ok');
    if(a.length < 4){ msg.textContent = 'Use at least 4 characters.'; return; }
    if(a !== b){ msg.textContent = 'Passwords do not match.'; return; }
    const res = await changePassword(document.getElementById('pw-target').value, a);
    msg.textContent = res.msg; if(res.ok){ msg.classList.add('auth-ok'); document.getElementById('pw-new').value=''; document.getElementById('pw-confirm').value=''; }
  };
  document.getElementById('log-user').onchange = e=>{ f.user = e.target.value; render(); };
  document.getElementById('log-type').onchange = e=>{ f.type = e.target.value; render(); };
  document.getElementById('log-export').onclick = ()=>{
    const rows = [['Time','User','Event','Detail','Count']].concat(shown.map(l=>[new Date(l.t).toLocaleString('en-IN'), l.user, l.type, l.detail, l.count||1]));
    const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
    a.download = 'cng-user-log-' + todayStr() + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  };
  document.getElementById('log-clear').onclick = async ()=>{
    if(!confirm('Clear the entire user log? Export it first if you need a record.')) return;
    if(window.__cngServer){ try{ await api('logs', { method:'DELETE' }); }catch(e){ return; } }
    else { authWrite('cngauth:logs', []); logActivity('act', 'Cleared user log'); }
    render();
  };
}

/* ============ INIT ============ */
async function startApp(){
  window.__authSilent = true;   // one-time startup migrations are not user actions — don't log them
  if(window.__cngStorageMode !== 'claude' && window.__cngStorageMode !== 'server' && folderSupported()){
    try{ state.savedFolderHandle = await loadSavedDirHandle(); }catch(e){ /* ignore */ }
  }
  const justImported = await runGasDetailsImportIfNeeded();
  const justFixedEx = await runAcmExFixIfNeeded();
  const justFullImported = await runGasFullImportIfNeeded();
  const justRateApplied = await runGasRateImportIfNeeded();
  if(justImported || justFixedEx || justFullImported || justRateApplied){
    state.date = GAS_IMPORT_DATE;
    state.group = 'ACM';
    state.importBanner = justRateApplied
      ? `Applied CNG Rate ₹${GAS_IMPORT_RATE.toFixed(2)}/Kg to every bus for ${fmtDateLong(GAS_IMPORT_DATE)}. Cost/KM is now calculated across the fleet — edit any row's rate individually if a bus filled at a different price.`
      : (justFullImported
        ? 'Imported CNG (Kg) for all 294 buses from the updated GAS_DETAILS.xlsx (28 Aug 2026), along with Opening/Closing KM. Every bus, including ACM EX-1 and ACM EX-2, is now complete for this date.'
        : (justImported
          ? 'Imported Opening/Closing KM for 292 buses from GAS_DETAILS.xlsx (28 Aug 2026), plus the confirmed readings for ACM EX-1 and ACM EX-2. CNG (Kg) is left blank — fill it in and save.'
          : 'Updated ACM EX-1 and ACM EX-2 with the confirmed Opening/Closing KM readings for 28 Aug 2026.'));
    state.rows = await buildRowsForGroupDate('ACM', GAS_IMPORT_DATE);
  }
  if(window.__cngStorageMode === 'memory'){
    state.importBanner = (state.importBanner ? state.importBanner + ' ' : '') +
      '⚠️ Your browser is blocking local storage (e.g. private/incognito mode), so entries won\'t be saved once this tab closes. Use a normal browser window for entries to persist.';
    if(!state.group){ state.group = 'ACM'; state.rows = await buildRowsForGroupDate('ACM', state.date); }
  }
  window.__authSilent = false;
  render();
}
(async ()=>{
  window.__cngServer = await detectServer();
  if(window.__cngServer){ window.storage = makeServerStorage(); window.__cngStorageMode = 'server'; }
  if(!authCurrent()) return renderLogin();
  if(window.__cngServer){
    const s = authCurrent();
    if(!s.token){ authSession.removeItem('cngauth:session'); return renderLogin(); }
    try{ const r = await api('me'); if(!r.ok) return; }catch(e){ return; }
  }
  startApp();
})();
