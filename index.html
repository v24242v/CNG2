<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNG Mileage Board</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #10141a;
    --panel: #171d26;
    --panel-2: #1e2530;
    --border: #2a3340;
    --text: #e8ecf1;
    --muted: #8b96a5;
    --muted-2: #5c6675;
    --green: #3dd68c;
    --green-dim: #1f4d3a;
    --amber: #f5b942;
    --amber-dim: #4d3d1a;
    --red: #f0665e;
    --red-dim: #4d2320;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --sans: 'Inter', -apple-system, sans-serif;
    --cond: 'Oswald', 'Arial Narrow', sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  #app{ max-width: 1100px; margin: 0 auto; padding: 16px 16px 60px; }

  /* ===== Header / Board ===== */
  .board-header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 18px;
    background: linear-gradient(180deg, #1a212c, #141a22);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 14px;
  }
  .board-title{
    font-family: var(--cond);
    font-size: 22px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text);
  }
  .board-title span{ color: var(--green); }
  .board-sub{ font-size: 11px; color: var(--muted-2); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
  .live-dot{
    width:8px; height:8px; border-radius:50%; background: var(--green);
    display:inline-block; margin-right:7px;
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  /* ===== Tabs ===== */
  .tabs{ display:flex; gap:4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab-btn{
    font-family: var(--cond);
    font-size: 15px; letter-spacing: 0.05em; text-transform: uppercase;
    background: none; border: none; color: var(--muted);
    padding: 10px 18px; cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn:hover{ color: var(--text); }
  .tab-btn.active{ color: var(--green); border-bottom-color: var(--green); }

  /* ===== Steps / breadcrumb ===== */
  .step-strip{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-bottom: 18px;
  }
  .step-chip{
    display:flex; align-items:center; gap:8px;
    background: var(--panel); border:1px solid var(--border);
    border-radius: 8px; padding: 8px 12px;
    font-size: 13px; color: var(--muted);
  }
  .step-chip b{ color: var(--text); font-weight: 600; }
  .step-chip .lbl{ color: var(--muted-2); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
  .step-chip.editable{ cursor:pointer; }
  .step-chip.editable:hover{ border-color: var(--green); }
  .chevron{ color: var(--muted-2); }

  input[type="date"]{
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    font-family: var(--mono); font-size: 14px; padding: 9px 12px; border-radius: 8px;
    colorScheme: dark;
  }
  input[type="date"]::-webkit-calendar-picker-indicator{ filter: invert(0.8); cursor:pointer; }
  .step-chip input[type="number"]{
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    font-family: var(--mono); font-size: 14px; padding: 8px 10px; border-radius: 8px;
  }
  .step-chip input[type="number"]:focus{ outline:none; border-color: var(--green); }

  /* ===== Group select cards ===== */
  .group-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin: 10px 0 20px; }
  .group-card{
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 16px; cursor: pointer; text-align:left;
    transition: transform 0.12s, border-color 0.12s, background 0.12s;
    position: relative; overflow: hidden;
  }
  .group-card:hover{ border-color: var(--green); transform: translateY(-2px); background: var(--panel-2); }
  .group-card .g-code{
    font-family: var(--cond); font-size: 26px; letter-spacing: 0.03em;
    color: var(--text);
  }
  .group-card .g-count{ font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top:4px; }
  .group-card .g-done{ font-size: 10px; color: var(--green); text-transform:uppercase; letter-spacing:0.08em; margin-top:8px; }
  .group-card .g-bar{ position:absolute; left:0; bottom:0; height:3px; background: var(--green); }

  h2.section-title{
    font-family: var(--cond); text-transform: uppercase; letter-spacing: 0.05em;
    font-size: 15px; color: var(--muted); margin: 4px 0 10px; font-weight:400;
  }

  /* ===== Grid table ===== */
  .grid-wrap{
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; margin-bottom: 16px;
  }
  .grid-scroll{ overflow-x: auto; }
  table.entry-grid{ border-collapse: collapse; width: 100%; min-width: 720px; }
  table.entry-grid thead th{
    position: sticky; top:0; z-index:2;
    background: #1c232e; color: var(--muted);
    font-family: var(--cond); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.entry-grid td{
    padding: 7px 12px; border-bottom: 1px solid #1f2733; font-size: 13.5px;
    white-space: nowrap;
  }
  table.entry-grid tbody tr:hover{ background: #1a212c; }
  table.entry-grid tbody tr:last-child td{ border-bottom: none; }
  .body-no{ font-weight:600; color: var(--text); }
  .veh-no{ font-family: var(--mono); font-size: 12px; color: var(--muted-2); }
  td input[type="number"]{
    width: 88px; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); font-family: var(--mono); font-size: 13px;
    padding: 6px 8px; border-radius: 6px;
  }
  td input[type="number"]:focus{ outline: none; border-color: var(--green); }
  td input[type="number"].err{ border-color: var(--red); }
  td input[type="number"]::-webkit-inner-spin-button{ opacity: 0.4; }
  .km-run{ font-family: var(--mono); color: var(--muted); }
  .cost-km{ font-family: var(--mono); color: var(--amber); font-size: 12.5px; }
  td .rate-in{ width: 74px; }
  .station-ticks{ display:flex; gap: 4px; }
  .station-tick{
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--muted-2); font-family: var(--mono); font-size: 11px; font-weight:700;
    cursor: pointer; display:flex; align-items:center; justify-content:center; transition: all 0.12s;
  }
  .station-tick:hover{ border-color: var(--muted); color: var(--text); }
  .station-tick.active{ background: var(--green); border-color: var(--green); color: #0a1410; }
  .avg-pill{
    font-family: var(--mono); font-weight:600; font-size: 13px;
    padding: 4px 9px; border-radius: 5px; display:inline-block; min-width: 48px; text-align:center;
  }
  .avg-good{ background: var(--green-dim); color: var(--green); }
  .avg-mid{ background: var(--amber-dim); color: var(--amber); }
  .avg-bad{ background: var(--red-dim); color: var(--red); }
  .avg-none{ color: var(--muted-2); }

  tfoot td{
    padding: 12px; font-family: var(--mono); font-size: 13px;
    background: #1c232e; border-top: 1px solid var(--border);
    color: var(--text); font-weight:600;
  }
  tfoot .foot-label{ font-family: var(--cond); text-transform: uppercase; letter-spacing:0.05em; font-weight:400; color:var(--muted); font-size:12px; }

  .extra-badge{
    font-family: var(--mono); font-size: 10px; color: var(--amber); margin-top: 3px;
    white-space: nowrap;
  }
  tr.extra-log-header td{
    background: #201a10; color: var(--amber); font-family: var(--cond); font-size: 11px;
    letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 12px; border-bottom: 1px solid var(--border);
    border-top: 2px solid var(--amber-dim);
  }
  tr.extra-log-row td{ background: #171410; }
  tr.extra-log-row .body-no{ color: var(--amber); }
  tr.extra-log-row .extra-detail{ color: var(--muted); font-size: 12px; white-space: normal; }

  /* ===== Actions bar ===== */
  .actions-bar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap: wrap; margin-top: 10px;
  }
  .btn{
    font-family: var(--cond); text-transform: uppercase; letter-spacing: 0.05em;
    font-size: 14px; border-radius: 8px; padding: 11px 22px; cursor:pointer;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    transition: all 0.15s;
  }
  .btn:hover{ border-color: var(--muted); }
  .btn-primary{ background: var(--green); color: #0a1410; border-color: var(--green); font-weight:600; }
  .btn-primary:hover{ background: #34c17d; }
  .save-status{ font-size: 12px; color: var(--muted-2); font-family: var(--mono); }
  .save-status.saved{ color: var(--green); }

  /* ===== Flip summary ===== */
  .summary-strip{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px;
    margin-bottom: 16px;
  }
  .flip-card{
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px;
  }
  .flip-card .f-label{ font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted-2); margin-bottom: 6px; }
  .flip-card .f-value{ font-family: var(--mono); font-size: 24px; font-weight:600; color: var(--text); }
  .flip-card.accent .f-value{ color: var(--green); }

  /* ===== History ===== */
  .hist-date-list{ display:flex; flex-direction:column; gap:8px; }
  .hist-date-row{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; cursor:pointer; transition: border-color 0.12s, background 0.12s;
  }
  .hist-date-row:hover{ border-color: var(--green); background: var(--panel-2); }
  .hist-date-main{ display:flex; align-items:center; gap:14px; }
  .hist-date-main .d{ font-family: var(--mono); font-size: 15px; color: var(--text); font-weight:600; }
  .hist-date-main .cnt{ font-size: 12px; color: var(--muted); }
  .hist-date-stats{ display:flex; gap: 18px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .hist-date-stats b{ color: var(--text); }
  .empty-state{
    text-align:center; padding: 50px 20px; color: var(--muted);
    background: var(--panel); border: 1px dashed var(--border); border-radius: 10px;
  }
  .empty-state .ei{ font-size: 34px; margin-bottom: 8px; }

  .back-link{
    background:none; border:none; color: var(--muted); font-size: 13px; cursor:pointer;
    display:flex; align-items:center; gap:6px; margin-bottom: 14px; padding: 4px 0;
  }
  .back-link:hover{ color: var(--green); }

  /* ===== Dashboard ===== */
  .dash-section{ margin-bottom: 26px; }
  .dash-grid-2{ display:grid; grid-template-columns: 1.1fr 1fr; gap: 16px; }
  @media (max-width: 800px){ .dash-grid-2{ grid-template-columns: 1fr; } }

  .metric-toggle{ display:flex; gap:6px; }
  .metric-toggle button{
    font-family: var(--cond); font-size: 12px; text-transform:uppercase; letter-spacing:0.05em;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; border-radius: 6px; cursor:pointer;
  }
  .metric-toggle button.active{ background: var(--green-dim); color: var(--green); border-color: var(--green); }

  .bar-chart{
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 18px 10px;
  }
  .bar-row{ display:flex; align-items:center; gap: 10px; margin-bottom: 12px; }
  .bar-row .bar-label{ width: 62px; flex-shrink:0; font-family: var(--cond); font-size: 13px; color: var(--muted); text-transform:uppercase; letter-spacing:0.03em; }
  .bar-row .bar-track{ flex:1; background: #10151d; border-radius: 5px; height: 20px; position:relative; overflow:hidden; }
  .bar-row .bar-fill{ height:100%; border-radius: 5px; transition: width 0.5s ease; display:flex; align-items:center; justify-content:flex-end; padding-right:8px; }
  .bar-row .bar-fill span{ font-family: var(--mono); font-size: 11px; font-weight:600; color: #0a1410; }
  .bar-fill.c-good{ background: var(--green); }
  .bar-fill.c-mid{ background: var(--amber); }
  .bar-fill.c-bad{ background: var(--red); }
  .bar-row .bar-sub{ width: 90px; flex-shrink:0; text-align:right; font-family: var(--mono); font-size: 11px; color: var(--muted-2); }

  .month-chart{
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px; display:flex; align-items:flex-end; gap: 8px; height: 190px; overflow-x:auto;
  }
  .month-col{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; min-width: 40px; flex-shrink:0; }
  .month-col .m-val{ font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-bottom: 5px; white-space:nowrap; }
  .month-col .m-bar{ width: 22px; border-radius: 4px 4px 0 0; transition: height 0.5s ease; }
  .month-col .m-lbl{ font-family: var(--cond); font-size: 10.5px; color: var(--muted-2); text-transform:uppercase; margin-top: 6px; white-space:nowrap; }

  .rank-table{ width:100%; border-collapse: collapse; }
  .rank-table th{
    text-align:left; font-family: var(--cond); font-size: 11px; text-transform:uppercase; letter-spacing:0.05em;
    color: var(--muted-2); padding: 6px 10px; border-bottom: 1px solid var(--border);
  }
  .rank-table td{ padding: 8px 10px; font-size: 13px; border-bottom: 1px solid #1f2733; }
  .rank-table tr:last-child td{ border-bottom:none; }
  .rank-num{ font-family: var(--mono); color: var(--muted-2); width: 22px; }
  .rank-table .rk-body{ font-weight:600; }
  .rank-table .rk-group{ font-size: 11px; color: var(--muted-2); }
  .rank-col-label{ font-size:11px; color:var(--muted-2); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px; }

  .depot-pill-row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 20px; }
  .avg-card-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; margin-bottom: 24px; }
  .avg-card{
    background: var(--panel); border: 1px solid var(--border); border-radius: 9px;
    padding: 12px 6px 10px; text-align: center; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .avg-card .ac-num{ font-family: var(--mono); font-weight:600; font-size: 13px; color: var(--text); }
  .avg-card .ac-days{ font-size: 10px; color: var(--muted-2); font-family: var(--mono); }

  .report-chart-wrap{
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; height: 340px; position: relative;
  }
  .range-selector-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin: 8px 0 10px; }
  .range-selector-row input[type="date"]{ padding: 6px 9px; font-size: 12.5px; }
  .depot-pill{
    font-family: var(--cond); font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase;
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    padding: 9px 18px; border-radius: 20px; cursor: pointer; transition: all 0.15s;
  }
  .depot-pill:hover{ border-color: var(--muted); color: var(--text); }
  .depot-pill.active{ background: var(--green); border-color: var(--green); color: #0a1410; font-weight: 600; }

  .body-pill-grid{ display:flex; flex-wrap:wrap; gap:6px; margin: 4px 0 22px; }
  .body-pill{
    font-family: var(--mono); font-size: 12.5px; font-weight:600;
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
    padding: 7px 12px; min-width: 34px; text-align:center; border-radius: 7px; cursor: pointer; transition: all 0.12s;
  }
  .body-pill:hover{ border-color: var(--muted); color: var(--text); }
  .body-pill.active{ background: var(--green); border-color: var(--green); color: #0a1410; }

  .report-chart-tooltip{
    position: absolute; transform: translate(-50%, -100%) translateY(-10px);
    background: #1c232e; border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-family: var(--mono); font-size: 11.5px; color: var(--text);
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.1s;
    z-index: 5;
  }
  .report-chart-tooltip.visible{ opacity: 1; }

  select.scope-select{
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    font-family: var(--mono); font-size: 13px; padding: 8px 10px; border-radius: 7px;
  }

  /* ===== Extra CNG tab ===== */
  .extra-form{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px; margin-bottom: 16px;
  }
  .form-field{ display:flex; flex-direction:column; gap:6px; }
  .form-field label{ font-size: 11px; text-transform:uppercase; letter-spacing:0.06em; color: var(--muted-2); font-family: var(--cond); }
  .form-field input, .form-field select{
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    font-family: var(--mono); font-size: 13px; padding: 9px 10px; border-radius: 7px;
  }
  .form-field input:focus, .form-field select:focus{ outline:none; border-color: var(--green); }
  .form-field.span-2{ grid-column: span 2; }
  @media (max-width: 560px){ .form-field.span-2{ grid-column: span 1; } }

  .extra-log-list{ display:flex; flex-direction:column; gap:8px; }
  .extra-log-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
  }
  .extra-log-item .eli-main{ font-size: 13px; }
  .extra-log-item .eli-main b{ color: var(--amber); font-family: var(--mono); }
  .extra-log-item .eli-meta{ font-size: 11px; color: var(--muted-2); margin-top: 2px; }
  .extra-log-item .eli-actions{ display:flex; gap:8px; flex-shrink:0; }
  .icon-btn{
    background:none; border: 1px solid var(--border); color: var(--muted); font-size: 11px;
    padding: 5px 10px; border-radius: 6px; cursor:pointer; font-family: var(--cond); text-transform:uppercase; letter-spacing:0.04em;
  }
  .icon-btn:hover{ border-color: var(--green); color: var(--text); }
  .icon-btn.danger:hover{ border-color: var(--red); color: var(--red); }

  .import-banner{
    background: #14241d; border: 1px solid var(--green-dim); color: var(--green);
    border-left: 3px solid var(--green); border-radius: 8px; padding: 12px 16px;
    font-size: 13px; line-height: 1.5; margin-bottom: 14px;
  }

  /* ===== Storage bar (offline mode) ===== */
  #storage-bar:empty{ display:none; }
  .storage-bar-inner{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; margin-bottom: 6px;
  }
  .storage-status{ font-size: 12.5px; color: var(--muted); }
  .storage-status b{ color: var(--text); }
  .storage-status.ok{ color: var(--green); }
  .storage-status.warn{ color: var(--amber); }
  .storage-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .storage-msg{ font-size: 11.5px; color: var(--muted-2); font-family: var(--mono); min-height: 14px; margin: 4px 2px 14px; }
  .storage-msg.ok{ color: var(--green); }
  .storage-msg.warn{ color: var(--red); }

  /* ===== Payment tab ===== */
  table.payment-table th:nth-child(3), table.payment-table th:nth-child(4), table.payment-table th:nth-child(5){ text-align:left; }
  table.payment-table .body-no{ color: var(--text); }
  tr.payment-extra-row td{ background: #201a10; }
  tr.payment-extra-row .body-no{ color: var(--amber); }
  .payment-tag{
    font-family: var(--cond); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    background: var(--amber-dim); color: var(--amber); padding: 3px 8px; border-radius: 4px;
  }

  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius:4px; }
  ::-webkit-scrollbar-track{ background: transparent; }

  @media (max-width: 560px){
    .board-title{ font-size: 18px; }
    .step-strip{ gap:6px; }
  }

  /* ===== Login / Auth ===== */
  .login-wrap{ min-height: calc(100vh - 80px); display:flex; align-items:center; justify-content:center; }
  .login-card{
    width:100%; max-width: 360px; background: var(--panel); border:1px solid var(--border);
    border-radius: 12px; padding: 26px 24px;
  }

function todayStr(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}
function dateMinusDays(days){
  const d = new Date();
  d.setDate(d.getDate() - days);
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}

/* ============ OFFLINE STORAGE SHIM ============
   If Claude's window.storage isn't present (i.e. this file was opened directly
   in a browser instead of inside a Claude conversation), fall back to the
   browser's own localStorage so the tool still saves and loads data offline.
   Same get/set/delete/list contract as Claude's storage API, so nothing else
   in this file needs to change. If localStorage itself is unavailable
   (rare, e.g. some locked-down private-browsing modes), falls back further
   to an in-memory store so the app still runs, just without persistence. */
(function setupOfflineStorageIfNeeded(){
  if(typeof window.storage !== 'undefined' && typeof window.storage.get === 'function'){
    window.__cngStorageMode = 'claude';
    return; // running inside Claude — use its real storage
  }
  const LS_PREFIX = 'cngboard:';
  function lsKey(key, shared){ return LS_PREFIX + (shared ? 'shared:' : 'priv:') + key; }
  try{
    const testKey = LS_PREFIX + '__test__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
    window.storage = {
      get: async (key, shared)=>{
        shared = !!shared;
        const raw = localStorage.getItem(lsKey(key, shared));
        if(raw === null) throw new Error('Key not found: ' + key);
        return { key, value: raw, shared };
      },
      set: async (key, value, shared)=>{
        shared = !!shared;
        localStorage.setItem(lsKey(key, shared), value);
        return { key, value, shared };
      },
      delete: async (key, shared)=>{
        shared = !!shared;
        localStorage.removeItem(lsKey(key, shared));
        return { key, deleted: true, shared };
      },
      list: async (prefix, shared)=>{
        shared = !!shared;
        prefix = prefix || '';
        const fullPrefix = lsKey(prefix, shared);
        const stripLen = LS_PREFIX.length + (shared ? 7 : 5);
        const keys = [];
        for(let i=0; i<localStorage.length; i++){
          const lk = localStorage.key(i);
          if(lk && lk.indexOf(fullPrefix) === 0) keys.push(lk.slice(stripLen));
        }
        return { keys, prefix, shared };
      }
    };
    window.__cngStorageMode = 'localStorage';

    /* When the tool is open in more than one browser tab/window at once (e.g. Entry in
       one tab, Dashboard in another), the browser's native 'storage' event fires in every
       OTHER tab the instant one of them saves — so this one re-renders itself immediately,
       no manual refresh needed. (It never fires in the tab that made the change itself;
       that tab already re-renders right after its own save.) */
    let cngStorageSyncTimer = null;
    window.addEventListener('storage', (e)=>{
      if(!e.key) return; // e.g. localStorage.clear() elsewhere — ignore
      if(e.key.indexOf(LS_PREFIX) !== 0) return; // only react to this tool's own keys
      clearTimeout(cngStorageSyncTimer);
      cngStorageSyncTimer = setTimeout(()=>{ if(typeof render === 'function') render(); }, 150);
    });
  }catch(e){
    // localStorage unavailable — use an in-memory fallback so the app still runs
    const mem = {};
    function mkey(key, shared){ return (shared ? 'shared:' : 'priv:') + key; }
    window.storage = {
      get: async (key, shared)=>{ const kk=mkey(key,shared); if(!(kk in mem)) throw new Error('Key not found: '+key); return {key, value:mem[kk], shared:!!shared}; },
      set: async (key, value, shared)=>{ mem[mkey(key,shared)] = value; return {key, value, shared:!!shared}; },
      delete: async (key, shared)=>{ delete mem[mkey(key,shared)]; return {key, deleted:true, shared:!!shared}; },
      list: async (prefix, shared)=>{ const p=mkey(prefix||'',shared); return {keys:Object.keys(mem).filter(x=>x.indexOf(p)===0), prefix, shared:!!shared}; }
    };
    window.__cngStorageMode = 'memory';
  }
})();

function folderSupported(){ return typeof window.showDirectoryPicker === 'function'; }

function folderFileName(key, shared){
  return (shared ? 'shared__' : '') + key.replace(/[^a-zA-Z0-9_\-]/g, '_') + '.json';
}
function makeFolderStorage(dirHandle){
  return {
    get: async (key, shared)=>{
      shared = !!shared;
      try{
        const fh = await dirHandle.getFileHandle(folderFileName(key, shared), { create:false });
        const file = await fh.getFile();
        const text = await file.text();
        return { key, value: text, shared };
      }catch(e){
        throw new Error('Key not found: ' + key);
      }
    },
    set: async (key, value, shared)=>{
      shared = !!shared;
      const fh = await dirHandle.getFileHandle(folderFileName(key, shared), { create:true });
      const writable = await fh.createWritable();
      await writable.write(value);
      await writable.close();
      return { key, value, shared };
    },
    delete: async (key, shared)=>{
      shared = !!shared;
      try{ await dirHandle.removeEntry(folderFileName(key, shared)); }catch(e){}
      return { key, deleted:true, shared };
    },
    list: async (prefix, shared)=>{
      shared = !!shared;
      prefix = prefix || '';
      const keys = [];
      for await (const [name, handle] of dirHandle.entries()){
        if(handle.kind !== 'file' || !name.endsWith('.json')) continue;
        const isShared = name.indexOf('shared__') === 0;
        if(isShared !== shared) continue;
        let base = isShared ? name.slice(8) : name;
        base = base.slice(0, -5); // strip .json
        if(base.indexOf(prefix) === 0) keys.push(base);
      }
      return { keys, prefix, shared };
    }
  };
}

/* Copies every key from one storage backend into another (used when connecting/reconnecting a folder, so nothing already entered is lost) */
async function migrateStorage(fromStorage, toStorage){
  for(const shared of [false, true]){
    let listRes;
    try{ listRes = await fromStorage.list('', shared); }catch(e){ continue; }
    if(!listRes || !listRes.keys) continue;
    for(const k of listRes.keys){
      try{
        const got = await fromStorage.get(k, shared);
        await toStorage.set(k, got.value, shared);
      }catch(e){ /* skip unreadable key */ }
    }
  }
}

/* Remembers the chosen folder (Chrome can re-grant permission to a stored handle after a click, without picking again) */
const IDB_NAME = 'cngboard-fs', IDB_STORE = 'handles';
function openHandleDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function saveDirHandle(handle){
  try{
    const db = await openHandleDB();
    await new Promise((res, rej)=>{
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(handle, 'dir');
      tx.oncomplete = res; tx.onerror = ()=> rej(tx.error);
    });
  }catch(e){ /* non-critical */ }
}
async function loadSavedDirHandle(){
  try{
    const db = await openHandleDB();
    return await new Promise((res)=>{
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get('dir');
      req.onsuccess = ()=> res(req.result || null);
      req.onerror = ()=> res(null);
    });
  }catch(e){ return null; }
}

async function connectFolder(){
  if(!folderSupported()) return { ok:false, reason:'unsupported' };
  let dirHandle;
  try{
    dirHandle = await window.showDirectoryPicker({ mode:'readwrite' });
  }catch(e){
    return { ok:false, reason:'cancelled' };
  }
  const folderStorage = makeFolderStorage(dirHandle);
  await migrateStorage(window.storage, folderStorage);
  window.storage = folderStorage;
  window.__cngStorageMode = 'folder';
  window.__cngFolderName = dirHandle.name;
  await saveDirHandle(dirHandle);
  return { ok:true, name: dirHandle.name };
}

async function reconnectSavedFolder(handle){
  try{
    let perm = await handle.queryPermission({ mode:'readwrite' });
    if(perm !== 'granted') perm = await handle.requestPermission({ mode:'readwrite' });
    if(perm !== 'granted') return { ok:false };
    const folderStorage = makeFolderStorage(handle);
    await migrateStorage(window.storage, folderStorage);
    window.storage = folderStorage;
    window.__cngStorageMode = 'folder';
    window.__cngFolderName = handle.name;
    return { ok:true, name: handle.name };
  }catch(e){
    return { ok:false };
  }
}

/* ============ BACKUP EXPORT / IMPORT (works in every browser) ============
   A single .json snapshot of everything saved. Put it in the same folder as
   this .html file, copy that folder anywhere, and Import it there to carry
   all the data across — the universal fallback to a connected folder. */
async function exportBackupJSON(){
  const bundle = { app:'cng-mileage-board', version:1, exportedAt: new Date().toISOString(), private:{}, shared:{} };
  for(const shared of [false, true]){
    let listRes;
    try{ listRes = await window.storage.list('', shared); }catch(e){ continue; }
    for(const k of (listRes.keys || [])){
      try{
        const got = await window.storage.get(k, shared);
        (shared ? bundle.shared : bundle.private)[k] = got.value;
      }catch(e){ /* skip */ }
    }
  }
  const blob = new Blob([JSON.stringify(bundle)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'cng-board-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  logActivity('act', 'Exported backup JSON');
}
async function importBackupFile(file){
  logActivity('act', `Imported backup: ${file.name}`);
  const text = await file.text();
  const bundle = JSON.parse(text);
  if(!bundle || (!bundle.private && !bundle.shared)) throw new Error('Not a valid backup file');
  for(const k of Object.keys(bundle.private || {})) await window.storage.set(k, bundle.private[k], false);
  for(const k of Object.keys(bundle.shared || {})) await window.storage.set(k, bundle.shared[k], true);
}

/* ============ STORAGE HELPERS ============ */
async function loadGroupData(group){
  try{
    const res = await window.storage.get('group-data-' + group, false);
    return res && res.value ? JSON.parse(res.value) : {};
  }catch(e){
    return {};
  }
}
async function saveGroupData(group, data){
  await window.storage.set('group-data-' + group, JSON.stringify(data), false);
  if(authCurrent() && !window.__authSilent) logActivity('act', `Saved main entries · ${group} · ${actContext()}`);
}

/* Extra CNG (mid-operation top-up fills) — stored separately per group, keyed by date, never touches the main daily entry */
async function loadExtraData(group){
  try{
    const res = await window.storage.get('extra-cng-' + group, false);
    return res && res.value ? JSON.parse(res.value) : {};
  }catch(e){
    return {};
  }
}
async function saveExtraData(group, data){
  await window.storage.set('extra-cng-' + group, JSON.stringify(data), false);
  if(authCurrent() && !window.__authSilent) logActivity('act', `Saved Extra CNG · ${group} · ${actContext()}`);
}
function getExtraForBusDate(extraData, date, bodyNo){
  const list = extraData[date] || [];
  return list.filter(e => e.body === bodyNo).reduce((s,e)=> s + (parseFloat(e.cng)||0), 0);
}
function getExtraCostForBusDate(extraData, date, bodyNo){
  const list = extraData[date] || [];
  return list.filter(e => e.body === bodyNo).reduce((s,e)=> s + ((parseFloat(e.cng)||0) * (parseFloat(e.rate)||0)), 0);
}
function getExtraListForDate(extraData, date){
  return extraData[date] || [];
}

/* find latest closing KM for a bus strictly before a given date */
function getPreviousClosing(groupData, date, bodyNo){
  const dates = Object.keys(groupData).filter(d => d < date).sort().reverse();
  for(const d of dates){
    const entry = groupData[d].find(r => r.body === bodyNo);
    if(entry && entry.closing !== '' && entry.closing !== null && entry.closing !== undefined){
      return entry.closing;
    }
  }
  return '';
}

/* ============ ROW BUILDING ============ */
const STATIONS = [
  { code:'KAVYA', label:'Kavya', abbr:'K' },
  { code:'PS', label:'PS', abbr:'P' },
  { code:'SWADESH', label:'Swadesh', abbr:'S' },
  { code:'RUP', label:'Rup Enterprise', abbr:'R' }
];

/* Matches loosely-formatted bus names from an uploaded spreadsheet ("ACM01", "ACM - 01", "acm 1") to the
   master bus list. Uppercases, strips spaces/dashes, then pairs a letters-prefix with a numeric suffix so
   "ACM01" and "ACM 01" and "acm-1" all normalize the same way as the master list's "ACM 01". */
function normalizeBusKey(s){
  s = String(s).toUpperCase().replace(/[\s\-]/g, '');
  const m = s.match(/^([A-Z]+)\D*?(\d+)$/);
  if(m) return m[1] + String(parseInt(m[2], 10));
  return s;
}
function buildMasterBusLookup(){
  const map = {};
  GROUPS.forEach(g=>{
    (BUS_DATA[g] || []).forEach(b=>{
      map[normalizeBusKey(b.body)] = { group:g, body:b.body, vehicle:b.vehicle };
    });
  });
  return map;
}

/* Matches loosely-typed CNG station names from a spreadsheet to one of the 4 known stations —
   covers plain names ("Kavya", "PS"), and the fuller business names seen on payment sheets
   ("Kavy Sales", "P S Anergy", "Rup Enterprise"). */
const STATION_ALIASES = {
  KAVYA:   ['KAVYA', 'KAVY', 'KAVYASALES', 'KAVYSALES'],
  PS:      ['PS', 'PSANERGY', 'PSENERGY', 'PSAGENCY'],
  SWADESH: ['SWADESH', 'SWADESHCNG'],
  RUP:     ['RUP', 'RUPENTERPRISE', 'RUPENTERPRISES']
};
function matchStationText(raw){
  if(raw===undefined || raw===null || raw==='') return null;
  const norm = String(raw).toUpperCase().replace(/[^A-Z]/g, '');
  if(!norm) return null;
  for(const code of Object.keys(STATION_ALIASES)){
    if(STATION_ALIASES[code].some(alias => norm===alias || norm.indexOf(alias)===0 || alias.indexOf(norm)===0)) return code;
  }
  return null;
}

async function buildRowsForGroupDate(group, date){
  const groupData = await loadGroupData(group);
  const extraData = await loadExtraData(group);
  const existing = groupData[date] || null;
  const buses = BUS_DATA[group] || [];
  return buses.map(b => {
    const extraCng = getExtraForBusDate(extraData, date, b.body);
    if(existing){
      const e = existing.find(r => r.body === b.body);
      if(e) return { body: b.body, vehicle: b.vehicle, opening: e.opening ?? '', closing: e.closing ?? '', cng: e.cng ?? '', rate: e.rate ?? '', station: e.station ?? null, extraCng };
    }
    const prevClosing = getPreviousClosing(groupData, date, b.body);
    return { body: b.body, vehicle: b.vehicle, opening: prevClosing, closing: '', cng: '', rate: '', station: null, extraCng };
  });
}
async function refreshExtraCngForRows(group, date){
  if(!state.rows || state.rows.length===0) return;
  const extraData = await loadExtraData(group);
  state.rows.forEach(r => { r.extraCng = getExtraForBusDate(extraData, date, r.body); });
}

/* ============ CALC HELPERS ============ */
function calcRow(row){
  const o = parseFloat(row.opening), c = parseFloat(row.closing), g = parseFloat(row.cng);
  const extra = parseFloat(row.extraCng) || 0;
  const validKm = !isNaN(o) && !isNaN(c) && c >= o;
  const km = validKm ? (c - o) : null;
  const mainCng = isNaN(g) ? 0 : g;
  const cngTotal = mainCng + extra;
  const validAvg = validKm && cngTotal > 0;
  const avg = validAvg ? (km / cngTotal) : null;
  const rateVal = parseFloat(row.rate);
  const rate = isNaN(rateVal) ? null : rateVal;
  const rowCost = rate!==null ? cngTotal * rate : null;
  const costPerKm = (rowCost!==null && km>0) ? (rowCost / km) : null;
  return { km, avg, invalid: (!isNaN(o) && !isNaN(c) && c < o), mainCng, extraCng: extra, cngTotal, rate, rowCost, costPerKm };
}
/* Per-depot-code performance benchmarks — SMAC runs AC buses, which naturally average
   lower than the non-AC depots, so it gets its own lower "good" bar. Bad-average cutoff
   is the same (3.0) across all four codes. */
const AVG_THRESHOLDS = {
  ACM:  { good: 4.5, bad: 3.0 },
  AOT:  { good: 4.5, bad: 3.0 },
  SMC:  { good: 4.5, bad: 3.0 },
  SMAC: { good: 4.0, bad: 3.0 }
};
const DEFAULT_AVG_THRESHOLD = { good: 4.5, bad: 3.0 };
function getAvgThresholds(group){
  return AVG_THRESHOLDS[group] || DEFAULT_AVG_THRESHOLD;
}
function avgClass(avg, group){
  if(avg === null) return 'avg-none';
  const t = getAvgThresholds(group);
  if(avg >= t.good) return 'avg-good';
  if(avg >= t.bad) return 'avg-mid';
  return 'avg-bad';
}
function extraLogRowsHtml(list, date){
  if(!list || list.length === 0) return '';
  return `<tr class="extra-log-header"><td colspan="10">EXTRA CNG &middot; MID-OPERATION FILLS (${fmtDateLong(date)})</td></tr>` +
    list.map(e=>{
      const st = e.station ? STATIONS.find(s=>s.code===e.station) : null;
      return `<tr class="extra-log-row">
      <td class="body-no">${e.body}</td>
      <td class="veh-no">${e.vehicle||''}</td>
      <td></td>
      <td></td>
      <td>${(parseFloat(e.cng)||0).toFixed(1)} kg</td>
      <td class="extra-detail">${e.rate!==''&&e.rate!==undefined&&e.rate!==null? '₹'+parseFloat(e.rate).toFixed(2) : ''}</td>
      <td></td>
      <td class="extra-detail">${e.remarks||''}</td>
      <td></td>
      <td class="extra-detail">${st? st.abbr : ''}</td>
    </tr>`;
    }).join('');
}

function BUS_DATA_TOTAL(){ return GROUPS.reduce((s,g)=> s + (BUS_DATA[g]?BUS_DATA[g].length:0), 0); }

function renderStorageBar(){
  const bar = document.getElementById('storage-bar');
  if(!bar) return;
  if(window.__cngStorageMode === 'claude'){ bar.innerHTML = ''; return; } // not relevant inside Claude

  const mode = window.__cngStorageMode;
  let statusHtml;
  if(mode === 'server'){
    statusHtml = `<span class="storage-status ok">☁ Saved on server — shared by all users</span>`;
  } else if(mode === 'folder'){
    statusHtml = `<span class="storage-status ok">📁 Saving to folder: <b>${window.__cngFolderName || 'connected'}</b></span>`;
  } else if(mode === 'memory'){
    statusHtml = `<span class="storage-status warn">⚠️ Storage blocked — entries won't be saved after this tab closes</span>`;
  } else {
    statusHtml = `<span class="storage-status">💾 Saved in this browser only</span>`;
  }

  let actionsHtml = '';
  if(mode !== 'folder' && mode !== 'server' && folderSupported()){
    actionsHtml += `<button class="btn" id="connect-folder-btn" style="padding:6px 12px; font-size:11px;">📁 Connect Local Folder</button>`;
  }
  if(mode !== 'folder' && mode !== 'server' && state.savedFolderHandle){
    actionsHtml += `<button class="btn" id="reconnect-folder-btn" style="padding:6px 12px; font-size:11px;">📁 Reconnect "${state.savedFolderHandle.name}"</button>`;
  }
  actionsHtml += `<button class="btn" id="export-backup-btn" style="padding:6px 12px; font-size:11px;">⬇ Export Backup</button>`;
  actionsHtml += `<label class="btn" for="import-backup-input" style="padding:6px 12px; font-size:11px; cursor:pointer;">⬆ Import Backup</label>
    <input type="file" id="import-backup-input" accept="application/json" style="display:none;">`;
  actionsHtml += `<button class="btn btn-primary" id="update-all-btn" style="padding:6px 12px; font-size:11px;">🔄 Update All Entries</button>`;

  const pendingMsg = state.storageMsg;
  bar.innerHTML = `<div class="storage-bar-inner">${statusHtml}<div class="storage-actions">${actionsHtml}</div></div>
    <div class="storage-msg${pendingMsg&&pendingMsg.ok?' ok':''}${pendingMsg&&pendingMsg.warn?' warn':''}" id="storage-msg">${pendingMsg? pendingMsg.text : ''}</div>`;
  state.storageMsg = null; // shown once; cleared so it doesn't repeat on the next unrelated render

  const connectBtn = document.getElementById('connect-folder-btn');
  if(connectBtn) connectBtn.onclick = async ()=>{
    setStorageMsg('Connecting…');
    const res = await connectFolder();
    if(res.ok){
      setStorageMsg(`✓ Connected to "${res.name}". All data now saves there.`, true);
      if(state.group){ state.rows = await buildRowsForGroupDate(state.group, state.date); }
      render();
    } else if(res.reason !== 'cancelled'){
      setStorageMsg('Could not connect a folder. Try again, or use Export/Import Backup instead.', false, true);
    } else {
      setStorageMsg('');
    }
  };
  const reconnectBtn = document.getElementById('reconnect-folder-btn');
  if(reconnectBtn) reconnectBtn.onclick = async ()=>{
    setStorageMsg('Reconnecting…');
    const res = await reconnectSavedFolder(state.savedFolderHandle);
    if(res.ok){
      setStorageMsg(`✓ Reconnected to "${res.name}".`, true);
      if(state.group){ state.rows = await buildRowsForGroupDate(state.group, state.date); }
      render();
    } else {
      setStorageMsg('Could not reconnect — pick the folder again.', false, true);
    }
  };
  document.getElementById('export-backup-btn').onclick = async ()=>{
    setStorageMsg('Preparing backup…');
    await exportBackupJSON();
    setStorageMsg('✓ Backup downloaded.', true);
  };
  document.getElementById('import-backup-input').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    setStorageMsg('Importing…');
    try{
      await importBackupFile(file);
      // rebuild the currently-viewed grid from the freshly-imported data — clearing to []
      // and relying on the grid's own refresh would leave it blank, since that refresh only
      // patches existing rows and skips rebuilding when there's nothing there yet
      state.rows = state.group ? await buildRowsForGroupDate(state.group, state.date) : [];
      setStorageMsg('✓ Backup imported. Click "Update All Entries" below to make sure every depot is refreshed.', true);
      render();
    }catch(err){
      setStorageMsg('Could not read that file — is it a CNG board backup .json?', false, true);
    }
  };
  document.getElementById('update-all-btn').onclick = async ()=>{
    setStorageMsg('Updating…');
    if(state.group){ state.rows = await buildRowsForGroupDate(state.group, state.date); }
    setStorageMsg('✓ All entries updated — ACM, AOT, SMAC, and SMC are all showing the latest saved data.', true);
    render();
  };
}
function setStorageMsg(text, ok, warn){
  // Persist to state so the message survives a render() that rebuilds this bar right after
  state.storageMsg = { text, ok: !!ok, warn: !!warn };
  const el = document.getElementById('storage-msg');
  if(!el) return;
  el.textContent = text;
  el.className = 'storage-msg' + (ok? ' ok':'') + (warn? ' warn':'');
}

    if(state.group){ state.rows = await buildRowsForGroupDate(state.group, state.date); }
    renderEntryBody();
  };

  renderEntryBody();

  async function handleClosingKmUpload(file){
    const resultEl = document.getElementById('bulk-upload-result');
    resultEl.innerHTML = `<div class="import-banner">Reading "${file.name}"…</div>`;
    try{
      if(typeof XLSX === 'undefined') throw new Error('XLSX library did not load — check your internet connection and try again.');
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
      const dataRows = rows.slice(1).filter(r => r && r[0]!=='' && r[0]!==undefined && r[0]!==null);

      const masterLookup = buildMasterBusLookup();
      const byGroup = {}; // group -> [{body, vehicle, closing, cng, station}]
      const unmatched = [];
      const unrecognizedStations = [];
      let cngAppliedCount = 0;
      let stationAppliedCount = 0;
      dataRows.forEach(r=>{
        const rawName = r[0];
        const rawClosing = r[1];
        const rawCng = r[2];
        const rawStation = r[3];
        const closingNum = parseFloat(rawClosing);
        const cngNum = parseFloat(rawCng);
        const hasCng = !isNaN(cngNum);
        if(rawName===undefined || rawName===null || rawName===''){ return; }
        if(isNaN(closingNum)){ unmatched.push(String(rawName) + ' (no valid Closing KM)'); return; }
        const key = normalizeBusKey(rawName);
        const match = masterLookup[key];
        if(!match){ unmatched.push(String(rawName)); return; }
        let stationCode = null;
        if(rawStation!==undefined && rawStation!==null && rawStation!==''){
          stationCode = matchStationText(rawStation);
          if(!stationCode) unrecognizedStations.push(`${rawName} ("${rawStation}")`);
        }
        if(!byGroup[match.group]) byGroup[match.group] = [];
        byGroup[match.group].push({ body: match.body, vehicle: match.vehicle, closing: closingNum, cng: hasCng ? cngNum : null, station: stationCode });
        if(hasCng) cngAppliedCount++;
        if(stationCode) stationAppliedCount++;
      });

      let updatedCount = 0;
      const perGroupCounts = {};
      for(const g of Object.keys(byGroup)){
        const groupData = await loadGroupData(g);
        const existing = groupData[state.date] || [];
        const existingMap = {};
        existing.forEach(e=>{ existingMap[e.body] = { ...e }; });
        byGroup[g].forEach(item=>{
          if(existingMap[item.body]){
            existingMap[item.body].closing = item.closing;
            if(item.cng!==null) existingMap[item.body].cng = item.cng;
            if(item.station) existingMap[item.body].station = item.station;
          } else {
            const prevClosing = getPreviousClosing(groupData, state.date, item.body);
            existingMap[item.body] = { body:item.body, vehicle:item.vehicle, opening: prevClosing, closing:item.closing, cng: item.cng!==null? item.cng : '', rate:'', station: item.station || null };
          }
          updatedCount++;
        });
        const buses = BUS_DATA[g] || [];
        groupData[state.date] = buses.map(b=> existingMap[b.body]).filter(Boolean);
        await saveGroupData(g, groupData);
        perGroupCounts[g] = byGroup[g].length;
      }

      if(state.group && byGroup[state.group]){
        state.rows = await buildRowsForGroupDate(state.group, state.date);
        renderEntryBody();
      }

      const groupSummary = Object.keys(perGroupCounts).map(g=>`${g}: ${perGroupCounts[g]}`).join(', ') || 'none';
      let msg = `<div class="import-banner">✓ Updated Closing KM for <b>${updatedCount}</b> bus(es) on ${fmtDateLong(state.date)} — ${groupSummary}. CNG (Kg) applied for ${cngAppliedCount}, Station applied for ${stationAppliedCount}.</div>`;
      if(unmatched.length>0){
        msg += `<div class="import-banner" style="background:#241a10; border-color:var(--amber-dim); color:var(--amber); border-left-color:var(--amber);">
          ⚠️ ${unmatched.length} row(s) could not be matched to a bus: ${unmatched.slice(0,12).join(', ')}${unmatched.length>12? ', +'+(unmatched.length-12)+' more':''}
        </div>`;
      }
      if(unrecognizedStations.length>0){
        msg += `<div class="import-banner" style="background:#241a10; border-color:var(--amber-dim); color:var(--amber); border-left-color:var(--amber);">
          ⚠️ ${unrecognizedStations.length} row(s) had a station name that wasn't recognized (Closing KM/CNG still applied, Station left unchanged): ${unrecognizedStations.slice(0,12).join(', ')}${unrecognizedStations.length>12? ', +'+(unrecognizedStations.length-12)+' more':''}
        </div>`;
      }
      resultEl.innerHTML = msg;
    }catch(err){
      resultEl.innerHTML = `<div class="import-banner" style="background:#241614; border-color:var(--red); color:var(--red); border-left-color:var(--red);">
        Could not read that file: ${err.message || 'unknown error'}. Make sure it's a .xlsx/.xls with Bus Name in column A, Closing KM in column B, CNG (Kg) in column C, and Station in column D (row 1 is treated as a header and skipped).
      </div>`;
    }
  }

  function renderEntryBody(){
    // remove old body if exists
    let old = document.getElementById('entry-body');
    if(old) old.remove();
    const body = document.createElement('div');
    body.id = 'entry-body';
    container.appendChild(body);

    if(document.getElementById('change-group-chip')){
      document.getElementById('change-group-chip').onclick = ()=>{ state.group = null; state.rows = []; state.defaultRate = ''; state.defaultStation = null; renderEntryBody(); refreshChips(); };
    }
    const rateInput = document.getElementById('default-rate-input');
    if(rateInput){
      rateInput.oninput = (e)=>{ state.defaultRate = e.target.value; };
    }
    const applyRateBtn = document.getElementById('apply-rate-btn');
    if(applyRateBtn){
      applyRateBtn.onclick = ()=>{
        const rv = state.defaultRate;
        if(rv==='' || isNaN(parseFloat(rv))) return;
        state.rows.forEach(r=>{ if(r.rate==='' || r.rate===null || r.rate===undefined) r.rate = rv; });
        renderGridRows();
        setSaveStatus('idle');
      };
    }
    const defaultStationTicksEl = document.getElementById('default-station-ticks');
    if(defaultStationTicksEl){
      defaultStationTicksEl.querySelectorAll('.station-tick').forEach(btn=>{
        btn.onclick = ()=>{
          const code = btn.dataset.code;
          state.defaultStation = (state.defaultStation === code) ? null : code;
          defaultStationTicksEl.querySelectorAll('.station-tick').forEach(b=> b.classList.toggle('active', b.dataset.code===state.defaultStation));
        };
      });
    }
    const applyStationBtn = document.getElementById('apply-station-btn');
    if(applyStationBtn){
      applyStationBtn.onclick = ()=>{
        if(!state.defaultStation) return;
        state.rows.forEach(r=>{ if(!r.station) r.station = state.defaultStation; });
        renderGridRows();
        setSaveStatus('idle');
      };
    }

    if(!state.group){
      body.innerHTML = `<h2 class="section-title">Select depot / bus body group</h2><div class="group-grid" id="group-grid"></div>`;
      const grid = document.getElementById('group-grid');
      GROUPS.forEach(g=>{
        const count = BUS_DATA[g] ? BUS_DATA[g].length : 0;
        const card = document.createElement('button');
        card.className = 'group-card';
        card.innerHTML = `<div class="g-code">${g}</div><div class="g-count">${count} buses</div><div class="g-bar" style="width:0%"></div>`;
        card.onclick = async ()=>{
          state.group = g;
          state.rows = await buildRowsForGroupDate(g, state.date);
          renderEntryTab(container.parentElement.tagName ? document.getElementById('tab-content') : container);
        };
        grid.appendChild(card);
      });
      return;
    }

    // grid for selected group + date
    const bannerHtml = state.importBanner ? `<div class="import-banner">${state.importBanner}</div>` : '';
    body.innerHTML = `
      <h2 class="section-title">${state.group} &middot; ${fmtDateLong(state.date)}</h2>
      ${bannerHtml}
      <div class="grid-wrap"><div class="grid-scroll">
        <table class="entry-grid">
          <thead><tr>
            <th>Body No.</th><th>Vehicle No.</th><th>Opening KM</th><th>Closing KM</th><th>CNG (Kg)</th><th>Rate ₹/Kg</th><th>KM Run</th><th>Avg (km/kg)</th><th>Cost/KM ₹</th><th>Station</th>
          </tr></thead>
          <tbody id="grid-body"></tbody>
          <tbody id="grid-extra-body"></tbody>
          <tfoot id="grid-foot"></tfoot>
        </table>
      </div></div>
      <div class="actions-bar">
        <span class="save-status" id="save-status">Auto-fills opening KM from last recorded closing KM.</span>
        <button class="btn btn-primary" id="save-btn">Save Entries</button>
      </div>
    `;
    state.importBanner = null;
    // refresh extra-CNG amounts on the cached rows (in case an Extra CNG fill was logged since these rows were built),
    // without touching any opening/closing/cng values the user has already typed
    refreshExtraCngForRows(state.group, state.date).then(renderGridRows);
    document.getElementById('save-btn').onclick = doSave;
  }

  function stationTicksHtml(r, idx){
    return `<div class="station-ticks" data-idx="${idx}">${STATIONS.map(s=>`
      <button type="button" class="station-tick ${r.station===s.code?'active':''}" data-code="${s.code}" title="${s.label}">${s.abbr}</button>
    `).join('')}</div>`;
  }

  function renderGridRows(){
    const tbody = document.getElementById('grid-body');
    tbody.innerHTML = state.rows.map((r,i)=>{
      const { km, avg, invalid, extraCng, costPerKm } = calcRow(r);
      return `<tr data-idx="${i}">
        <td class="body-no">${r.body}</td>
        <td class="veh-no">${r.vehicle}</td>
        <td><input type="number" inputmode="decimal" class="opening-in ${invalid?'err':''}" value="${r.opening}" placeholder="0"></td>
        <td><input type="number" inputmode="decimal" class="closing-in ${invalid?'err':''}" value="${r.closing}" placeholder="0"></td>
        <td><input type="number" inputmode="decimal" class="cng-in" value="${r.cng}" placeholder="0" step="0.01">${extraCng>0?`<div class="extra-badge">+${extraCng.toFixed(1)}kg extra</div>`:''}</td>
        <td><input type="number" inputmode="decimal" class="rate-in" value="${r.rate}" placeholder="0" step="0.01"></td>
        <td class="km-run">${km!==null? km.toFixed(1): '—'}</td>
        <td><span class="avg-pill ${avgClass(avg, state.group)}">${avg!==null? avg.toFixed(2): '—'}</span></td>
        <td class="cost-km">${costPerKm!==null? '₹'+costPerKm.toFixed(2): '—'}</td>
        <td>${stationTicksHtml(r, i)}</td>
      </tr>`;
    }).join('');

    tbody.querySelectorAll('tr').forEach(tr=>{
      const idx = +tr.dataset.idx;
      tr.querySelector('.opening-in').oninput = (e)=>{ state.rows[idx].opening = e.target.value; updateRowDisplay(tr, idx); };
      tr.querySelector('.closing-in').oninput = (e)=>{ state.rows[idx].closing = e.target.value; updateRowDisplay(tr, idx); };
      tr.querySelector('.cng-in').oninput = (e)=>{ state.rows[idx].cng = e.target.value; updateRowDisplay(tr, idx); };
      tr.querySelector('.rate-in').oninput = (e)=>{ state.rows[idx].rate = e.target.value; updateRowDisplay(tr, idx); };
      tr.querySelectorAll('.station-tick').forEach(btn=>{
        btn.onclick = ()=>{
          const code = btn.dataset.code;
          state.rows[idx].station = (state.rows[idx].station === code) ? null : code;
          tr.querySelectorAll('.station-tick').forEach(b=> b.classList.toggle('active', b.dataset.code===state.rows[idx].station));
          setSaveStatus('idle');
        };
      });
    });
    renderExtraLogRows();
    renderFoot();
  }

  async function renderExtraLogRows(){
    const extraTbody = document.getElementById('grid-extra-body');
    if(!extraTbody) return;
    const extraData = await loadExtraData(state.group);
    const list = getExtraListForDate(extraData, state.date);
    extraTbody.innerHTML = extraLogRowsHtml(list, state.date);
  }

  function updateRowDisplay(tr, idx){
    const r = state.rows[idx];
    const { km, avg, invalid, costPerKm } = calcRow(r);
    tr.querySelector('.km-run').textContent = km!==null? km.toFixed(1) : '—';
    const pill = tr.querySelector('.avg-pill');
    pill.className = 'avg-pill ' + avgClass(avg, state.group);
    pill.textContent = avg!==null? avg.toFixed(2) : '—';
    tr.querySelector('.cost-km').textContent = costPerKm!==null? '₹'+costPerKm.toFixed(2) : '—';
    tr.querySelector('.opening-in').classList.toggle('err', invalid);
    tr.querySelector('.closing-in').classList.toggle('err', invalid);
    renderFoot();
    setSaveStatus('idle');
  }

  function renderFoot(){
    const foot = document.getElementById('grid-foot');
    if(!foot) return;
    let totalKm = 0, totalCng = 0, totalCost = 0, hasCost = false;
    state.rows.forEach(r=>{
      const { km, cngTotal, rowCost } = calcRow(r);
      if(km!==null) totalKm += km;
      totalCng += cngTotal;
      if(rowCost!==null){ totalCost += rowCost; hasCost = true; }
    });
    const fleetAvg = totalCng>0 ? (totalKm/totalCng) : null;
    const fleetCostPerKm = (hasCost && totalKm>0) ? (totalCost/totalKm) : null;
    foot.innerHTML = `<tr>
      <td colspan="2" class="foot-label">TOTAL / FLEET AVG</td>
      <td></td><td></td>
      <td>${totalCng>0? totalCng.toFixed(1):'—'} kg</td>
      <td></td>
      <td>${totalKm>0? totalKm.toFixed(1):'—'} km</td>
      <td><span class="avg-pill ${avgClass(fleetAvg, state.group)}">${fleetAvg!==null? fleetAvg.toFixed(2):'—'}</span></td>
      <td>${fleetCostPerKm!==null? '₹'+fleetCostPerKm.toFixed(2):'—'}</td>
      <td></td>
    </tr>`;
  }

  function setSaveStatus(s){
    const el = document.getElementById('save-status');
    if(!el) return;
    if(s==='saving'){ el.textContent = 'Saving...'; el.className='save-status'; }
    else if(s==='saved'){ el.textContent = '✓ Saved'; el.className='save-status saved'; }
    else{ el.textContent = 'Auto-fills opening KM from last recorded closing KM.'; el.className='save-status'; }
  }

  async function doSave(){
    setSaveStatus('saving');
    const groupData = await loadGroupData(state.group);
    // save rows, but only rows with at least one field filled are stored (still store all to keep grid consistent)
    groupData[state.date] = state.rows.map(r=>({
      body: r.body, vehicle: r.vehicle,
      opening: r.opening===''? '': parseFloat(r.opening),
      closing: r.closing===''? '': parseFloat(r.closing),
      cng: r.cng===''? '': parseFloat(r.cng),
      rate: r.rate===''? '': parseFloat(r.rate),
      station: r.station || null
    }));
    await saveGroupData(state.group, groupData);
    setSaveStatus('saved');
  }

  function refreshChips(){
    renderEntryTab(document.getElementById('tab-content') || container);
  }
}

function fmtDateLong(dstr){
  const [y,m,d] = dstr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric', weekday:'short' });
}

function busKeyOf(group, body){ return group + '|' + body; }
function busFromKey(key){
  const [group, body] = key.split('|');
  const b = (BUS_DATA[group]||[]).find(x=>x.body===body);
  return { group, body, vehicle: b? b.vehicle : '' };
}

          grid.appendChild(card);
        });
        return;
      }

      body.innerHTML = `
        <div class="grid-wrap"><div class="grid-scroll">
          <table class="entry-grid">
            <thead><tr><th>Body No.</th><th>Vehicle No.</th><th>CNG (Kg)</th><th>Rate ₹/Kg</th><th>Station</th><th></th></tr></thead>
            <tbody id="extra-grid-body-rows"></tbody>
          </table>
        </div></div>
        <div class="actions-bar">
          <span class="save-status" id="extra-grid-status">Only rows you edit get saved — untouched rows (including any with multiple fills logged below) are left alone.</span>
          <button class="btn btn-primary" id="extra-grid-save-btn">Save Entries</button>
        </div>
      `;
      document.getElementById('extra-grid-save-btn').onclick = doSaveExtraGrid;

    function renderGridRows(){
      const tbody = document.getElementById('extra-grid-body-rows');
      if(!tbody) return;
      tbody.innerHTML = state.extraGridRows.map((r,i)=>`<tr data-idx="${i}">
        <td class="body-no">${r.body}</td>

        <td><input type="number" inputmode="decimal" class="egrid-rate-in" value="${r.rate}" placeholder="0" step="0.01"></td>

      </tr>`).join('');
      tbody.querySelectorAll('tr').forEach(tr=>{

        tr.querySelector('.egrid-cng-in').oninput = (e)=>{ state.extraGridRows[idx].cng = e.target.value; state.extraGridRows[idx].touched = true; setGridStatus('idle'); };
        tr.querySelector('.egrid-rate-in').oninput = (e)=>{ state.extraGridRows[idx].rate = e.target.value; state.extraGridRows[idx].touched = true; setGridStatus('idle'); };

          btn.onclick = ()=>{

            state.extraGridRows[idx].station = (state.extraGridRows[idx].station === code) ? null : code;
            state.extraGridRows[idx].touched = true;
            tr.querySelectorAll('.station-tick').forEach(b=> b.classList.toggle('active', b.dataset.code===state.extraGridRows[idx].station));

    function stationTicksHtmlFor(r, idx){
      return `<div class="station-ticks" data-idx="${idx}">${STATIONS.map(s=>`
        <button type="button" class="station-tick ${r.station===s.code?'active':''}" data-code="${s.code}" title="${s.label}">${s.abbr}</button>
      `).join('')}</div>`;
    }

    function setGridStatus(s){
      const el = document.getElementById('extra-grid-status');
      if(!el) return;
      if(s==='saving'){ el.textContent = 'Saving...'; el.className='save-status'; }
      else if(s==='saved'){ el.textContent = '✓ Saved'; el.className='save-status saved'; }
      else{ el.textContent = 'Only rows you edit get saved — untouched rows (including any with multiple fills logged below) are left alone.'; el.className='save-status'; }
    }

    async function doSaveExtraGrid(){
      setGridStatus('saving');
      const group = state.extraGridGroup, date = state.extraGridDate;
      const extraData = await loadExtraData(group);
      if(!extraData[date]) extraData[date] = [];
      state.extraGridRows.forEach(row=>{
        if(!row.touched) return;
        const cngVal = parseFloat(row.cng);
        if(isNaN(cngVal) || cngVal<=0) return; // don't delete existing fills via the grid; skip if left blank
        extraData[date] = extraData[date].filter(e=> e.body!==row.body); // replace this bus's fill(s) for the day
        const id = 'ex' + Date.now() + Math.random().toString(36).slice(2,7);
        extraData[date].push({
          id, body: row.body, vehicle: row.vehicle, remarks: '',
          cng: cngVal,
          rate: row.rate===''? '': parseFloat(row.rate),
          station: row.station || null
        });
      });
      await saveExtraData(group, extraData);
      state.extraGridRows = await buildExtraGridRows(group, date);
      renderGridRows();
      setGridStatus('saved');
      if(f.busKey){ const { group:curGroup } = busFromKey(f.busKey); if(curGroup===group) renderExtraLog(); }
    }
  }

  async function buildExtraGridRows(group, date){
    const extraData = await loadExtraData(group);
    const dayList = extraData[date] || [];
    const buses = BUS_DATA[group] || [];
    return buses.map(b=>{
      const entries = dayList.filter(e=>e.body===b.body);
      const totalCng = entries.reduce((s,e)=> s + (parseFloat(e.cng)||0), 0);
      const last = entries[entries.length-1];
      return {
        body: b.body, vehicle: b.vehicle,
        cng: entries.length ? totalCng : '',
        rate: last ? (last.rate ?? '') : '',
        station: last ? (last.station || null) : null,
        touched: false,
        entryCount: entries.length
      };
    });
  }

  async function handleExtraCngUpload(file){
    const resultEl = document.getElementById('extra-bulk-upload-result');
    resultEl.innerHTML = `<div class="import-banner">Reading "${file.name}"…</div>`;
    try{
      if(typeof XLSX === 'undefined') throw new Error('XLSX library did not load — check your internet connection and try again.');
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:'array' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
      const dataRows = rows.slice(1).filter(r => r && r[0]!=='' && r[0]!==undefined && r[0]!==null);

      const masterLookup = buildMasterBusLookup();
      const byGroup = {}; // group -> [{body, vehicle, cng, station}]
      const unmatched = [];
      const unrecognizedStations = [];
      let stationAppliedCount = 0;
      dataRows.forEach(r=>{
        const rawName = r[0];
        const rawCng = r[1];
        const rawStation = r[2];
        const cngNum = parseFloat(rawCng);
        if(rawName===undefined || rawName===null || rawName===''){ return; }
        if(isNaN(cngNum) || cngNum<=0){ unmatched.push(String(rawName) + ' (no valid CNG Kg)'); return; }
        const key = normalizeBusKey(rawName);
        const match = masterLookup[key];
        if(!match){ unmatched.push(String(rawName)); return; }
        let stationCode = null;
        if(rawStation!==undefined && rawStation!==null && rawStation!==''){
          stationCode = matchStationText(rawStation);
          if(!stationCode) unrecognizedStations.push(`${rawName} ("${rawStation}")`);
        }
        if(!byGroup[match.group]) byGroup[match.group] = [];
        byGroup[match.group].push({ body: match.body, vehicle: match.vehicle, cng: cngNum, station: stationCode });
        if(stationCode) stationAppliedCount++;
      });

      let addedCount = 0;
      const perGroupCounts = {};
      const uploadDate = state.extraUploadDate;
      for(const g of Object.keys(byGroup)){
        const extraData = await loadExtraData(g);
        if(!extraData[uploadDate]) extraData[uploadDate] = [];
        byGroup[g].forEach(item=>{
          const id = 'ex' + Date.now() + Math.random().toString(36).slice(2,7);
          extraData[uploadDate].push({ id, body:item.body, vehicle:item.vehicle, remarks:'', cng:item.cng, rate:'', station:item.station||null });
          addedCount++;
        });
        await saveExtraData(g, extraData);
        perGroupCounts[g] = byGroup[g].length;
      }

      // the closing renderExtraCngTab(container) call below re-fetches and displays the
      // currently-selected bus's log fresh, so no extra refresh logic is needed here

      const groupSummary = Object.keys(perGroupCounts).map(g=>`${g}: ${perGroupCounts[g]}`).join(', ') || 'none';
      let msg = `<div class="import-banner">✓ Added <b>${addedCount}</b> extra CNG fill(s) for ${fmtDateLong(uploadDate)} — ${groupSummary}. Station applied for ${stationAppliedCount} of them. Rate is left blank — edit each entry (or the row's Rate/Station) individually if needed.</div>`;
      if(unmatched.length>0){
        msg += `<div class="import-banner" style="background:#241a10; border-color:var(--amber-dim); color:var(--amber); border-left-color:var(--amber);">
          ⚠️ ${unmatched.length} row(s) could not be matched to a bus: ${unmatched.slice(0,12).join(', ')}${unmatched.length>12? ', +'+(unmatched.length-12)+' more':''}
        </div>`;
      }
      if(unrecognizedStations.length>0){
        msg += `<div class="import-banner" style="background:#241a10; border-color:var(--amber-dim); color:var(--amber); border-left-color:var(--amber);">
          ⚠️ ${unrecognizedStations.length} row(s) had a station name that wasn't recognized (CNG entry still added, Station left blank): ${unrecognizedStations.slice(0,12).join(', ')}${unrecognizedStations.length>12? ', +'+(unrecognizedStations.length-12)+' more':''}
        </div>`;
      }
      state.extraUploadResultMsg = msg;
      renderExtraCngTab(container);
    }catch(err){
      resultEl.innerHTML = `<div class="import-banner" style="background:#241614; border-color:var(--red); color:var(--red); border-left-color:var(--red);">
        Could not read that file: ${err.message || 'unknown error'}. Make sure it's a .xlsx/.xls with Bus Body Number in column A, CNG (Kg) in column B, and Station in column C (row 1 is treated as a header and skipped).
      </div>`;
    }
  }

        <div>
          <div class="eli-main"><b>${(parseFloat(e.cng)||0).toFixed(1)} kg</b> &middot; ${fmtDateLong(e.date)}${e.rate? ' &middot; ₹'+parseFloat(e.rate).toFixed(2)+'/kg':''}${stationLabel? ' &middot; '+stationLabel:''}</div>

}


/* ============ PAYMENT TAB ============ */
async function computePaymentRows(date){
  const rows = [];
  for(const g of GROUPS){
    // Main entries: each bus row with a station ticked contributes its own CNG (Kg) at its own rate
    const groupData = await loadGroupData(g);
    const dayRows = groupData[date] || [];
    const mainByStation = {}; // station -> { kg, amount }
    dayRows.forEach(r=>{
      if(!r.station) return;
      const kg = parseFloat(r.cng);
      if(isNaN(kg) || kg <= 0) return;
      const rate = parseFloat(r.rate) || 0;
      if(!mainByStation[r.station]) mainByStation[r.station] = { kg:0, amount:0 };
      mainByStation[r.station].kg += kg;
      mainByStation[r.station].amount += kg * rate;
    });
    Object.keys(mainByStation).forEach(stationCode=>{
      const b = mainByStation[stationCode];
      rows.push({ station: stationCode, group: g, kg: b.kg, amount: b.amount, rate: b.kg>0? b.amount/b.kg : 0, tag: null });
    });

    // Extra CNG top-ups: each entry with a station ticked contributes separately
    const extraData = await loadExtraData(g);
    const dayExtras = extraData[date] || [];
    const extraByStation = {};
    dayExtras.forEach(e=>{
      if(!e.station) return;
      const kg = parseFloat(e.cng);
      if(isNaN(kg) || kg <= 0) return;
      const rate = parseFloat(e.rate) || 0;
      if(!extraByStation[e.station]) extraByStation[e.station] = { kg:0, amount:0 };
      extraByStation[e.station].kg += kg;
      extraByStation[e.station].amount += kg * rate;
    });
    Object.keys(extraByStation).forEach(stationCode=>{
      const b = extraByStation[stationCode];
      rows.push({ station: stationCode, group: g, kg: b.kg, amount: b.amount, rate: b.kg>0? b.amount/b.kg : 0, tag: 'EXTRA' });
    });
  }
  // order: by station (in STATIONS array order), then by depot (GROUPS order), main rows before EXTRA rows
  const stationOrder = STATIONS.map(s=>s.code);
  const groupOrder = GROUPS;
  rows.sort((a,b)=>{
    const sd = stationOrder.indexOf(a.station) - stationOrder.indexOf(b.station);
    if(sd!==0) return sd;
    const gd = groupOrder.indexOf(a.group) - groupOrder.indexOf(b.group);
    if(gd!==0) return gd;
    return (a.tag? 1:0) - (b.tag? 1:0);
  });
  return rows;
}

/* ============ REPORT TAB (per-bus historical chart, pure SVG — no external library, works fully offline) ============ */

/* Strips the depot-code prefix off a body string so only the bus's own number/suffix shows,
   e.g. "ACM 01" -> "01", "AOT - 01" -> "01", "SMAC01" -> "01", "ACM EX-1" -> "EX-1". */
function extractBodyNumber(fullBody, group){
  let s = String(fullBody).trim();
  s = s.replace(new RegExp('^' + group, 'i'), '');
  s = s.replace(/^[\s\-]+/, '');
  return s || fullBody;
}

/* Comprehensive "at a glance" bus average view: pick one depot code, pick a period
   (7 days / fortnight / month), see every bus in that depot as a compact card with its
   weighted average for that window underneath the bus number. */
async function renderAvgByPeriodSection(container){
  if(!state.avgTableDepot) state.avgTableDepot = 'ACM';

    </div>

      <button data-p="7" class="${state.avgTablePeriod==='7'?'active':''}">Last 7 Days</button>
      <button data-p="14" class="${state.avgTablePeriod==='14'?'active':''}">Last Fortnight</button>
      <button data-p="30" class="${state.avgTablePeriod==='30'?'active':''}">Last Month</button>

    </div>
    <div id="avg-table-body"></div>
  `;

  document.querySelectorAll('#avg-depot-row .depot-pill').forEach(btn=>{
    btn.onclick = ()=>{
      state.avgTableDepot = btn.dataset.code;
      document.querySelectorAll('#avg-depot-row .depot-pill').forEach(b=>b.classList.toggle('active', b===btn));
      renderAvgTableBody();
    };
  });
  document.querySelectorAll('#avg-period-toggle button[data-p]').forEach(btn=>{
    btn.onclick = ()=>{
      state.avgTablePeriod = btn.dataset.p;
      document.querySelectorAll('#avg-period-toggle button[data-p]').forEach(b=>b.classList.toggle('active', b===btn));
      renderAvgTableBody();
    };
  });
  document.getElementById('avg-download-svg-btn').onclick = async ()=>{
    const { depot, days, buses, byBus } = await computeAvgByPeriodData();
    const svg = buildAvgGridSvg(depot, days, buses, byBus);
    downloadSvgFile(svg, `${depot}-avg-last-${days}-days-${todayStr()}.svg`);
  };

  await renderAvgTableBody();

  async function computeAvgByPeriodData(){
    const days = parseInt(state.avgTablePeriod, 10);
    const cutoff = dateMinusDays(days - 1);
    const depot = state.avgTableDepot;
    const allRecords = await loadAllRecords();
    const recent = allRecords.filter(r => r.date >= cutoff && r.group === depot);

    const byBus = {};
    recent.forEach(r=>{
      if(!byBus[r.body]) byBus[r.body] = { km:0, cng:0, daysLogged:0 };
      if(r.km!==null) byBus[r.body].km += r.km;
      byBus[r.body].cng += (r.cngTotal||0);
      if(r.avg!==null) byBus[r.body].daysLogged++;
    });

    return { depot, days, buses: BUS_DATA[depot] || [], byBus };
  }

  async function renderAvgTableBody(){
    const bodyEl = document.getElementById('avg-table-body');
    bodyEl.innerHTML = `<div class="empty-state">Computing…</div>`;
    const { depot, days, buses, byBus } = await computeAvgByPeriodData();

    bodyEl.innerHTML = `<div class="avg-card-grid">${buses.map(b=>{
      const d = byBus[b.body];
      const avg = d && d.cng>0 ? d.km/d.cng : null;
      const num = extractBodyNumber(b.body, depot);
      return `<div class="avg-card">
        <div class="ac-num">${num}</div>
        <span class="avg-pill ${avgClass(avg, depot)}">${avg!==null? avg.toFixed(2):'—'}</span>
        <div class="ac-days">${d? d.daysLogged : 0}/${days}d</div>
      </div>`;
    }).join('')}</div>`;
  }
}

/* Builds a single self-contained SVG "frame" of every bus in a depot for a given period —
   sized and colored to match the app, easy to share as an image. */
function buildAvgGridSvg(depot, days, buses, byBus){
  const cols = 10;
  const cellW = 108, cellH = 78, gap = 8;
  const marginX = 24, marginTop = 74, marginBottom = 24;
  const rows = Math.max(1, Math.ceil(buses.length / cols));
  const width = marginX*2 + cols*cellW + (cols-1)*gap;
  const height = marginTop + rows*cellH + (rows-1)*gap + marginBottom;
  const periodLabel = days===7 ? 'Last 7 Days' : days===14 ? 'Last Fortnight' : 'Last Month';

  const tierColors = {
    'avg-good': { bg:'#1f4d3a', fg:'#3dd68c' },
    'avg-mid':  { bg:'#4d3d1a', fg:'#f5b942' },
    'avg-bad':  { bg:'#4d2320', fg:'#f0665e' },
    'avg-none': { bg:'#1e2530', fg:'#5c6675' }
  };

  let cellsSvg = '';
  buses.forEach((b,i)=>{
    const col = i % cols, row = Math.floor(i / cols);
    const x = marginX + col*(cellW+gap);
    const y = marginTop + row*(cellH+gap);
    const d = byBus[b.body];
    const avg = d && d.cng>0 ? d.km/d.cng : null;
    const num = extractBodyNumber(b.body, depot);
    const cls = avgClass(avg, depot);
    const c = tierColors[cls];
    const avgText = avg!==null ? avg.toFixed(2) : '—';
    const daysText = `${d ? d.daysLogged : 0}/${days}d`;

    cellsSvg += `
      <g>
        <rect x="${x}" y="${y}" width="${cellW}" height="${cellH}" rx="9" fill="#171d26" stroke="#2a3340" stroke-width="1"/>
        <text x="${x+cellW/2}" y="${y+23}" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="14" fill="#e8ecf1">${num}</text>
        <rect x="${x+cellW/2-30}" y="${y+31}" width="60" height="22" rx="5" fill="${c.bg}"/>
        <text x="${x+cellW/2}" y="${y+46}" text-anchor="middle" font-family="'Courier New',monospace" font-weight="700" font-size="12" fill="${c.fg}">${avgText}</text>
        <text x="${x+cellW/2}" y="${y+68}" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#5c6675">${daysText}</text>
      </g>`;
  });

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
    <rect width="${width}" height="${height}" fill="#10141a"/>
    <text x="${marginX}" y="34" font-family="Arial,sans-serif" font-weight="700" font-size="21" fill="#e8ecf1">${depot} &#8212; ${periodLabel}</text>
    <text x="${marginX}" y="54" font-family="'Courier New',monospace" font-size="11" fill="#8b96a5">Avg (km/kg) per bus &#183; generated ${fmtDateLong(todayStr())} &#183; ${buses.length} buses</text>
    ${cellsSvg}
  </svg>`;
}

function downloadSvgFile(svgString, filename){
  const blob = new Blob([svgString], { type:'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
